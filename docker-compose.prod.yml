# EduOS / JeetMantra — production stack for a single Ubuntu VPS.
#
#   cp .env.example .env.production   # fill in real values
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Auto-update flow: GitHub Actions builds + pushes ghcr.io/<owner>/<repo>:latest
# on every push to main; Watchtower (below) polls GHCR and recreates the `api`
# container with the new image — no manual deploy step.
#
# NOTE: Supabase is self-hosted separately (its own compose / host) — this stack
# talks to it over HTTPS via SUPABASE_URL.

services:
  # ── Reverse proxy + automatic TLS (Let's Encrypt) ──────────────────────────
  proxy:
    image: traefik:v3.1
    container_name: eduos_proxy
    restart: always
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge]

  # ── Application (Node API + static frontend) ───────────────────────────────
  api:
    image: ${API_IMAGE:-ghcr.io/jitendramindset/jeetmantraclaude:latest}
    container_name: eduos_api
    restart: always
    env_file: [.env.production]
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
    depends_on: [redis]
    networks: [edge, internal]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1500M }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.services.api.loadbalancer.server.port=5000
      - com.centurylinklabs.watchtower.enable=true   # Watchtower watches this one

  # ── Cache ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eduos_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redis_data:/data]
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 320M }

  # ── n8n automation (creds via env — NOT hardcoded) ─────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: eduos_n8n
    restart: always
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_DOMAIN}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes: [n8n_data:/home/node/.n8n]
    networks: [edge, internal]
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`${N8N_DOMAIN}`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls.certresolver=le
      - traefik.http.services.n8n.loadbalancer.server.port=5678

  # ── Auto-updater: pulls new images for labeled containers ──────────────────
  watchtower:
    image: containrrr/watchtower
    container_name: eduos_watchtower
    restart: always
    environment:
      - WATCHTOWER_LABEL_ENABLE=true          # only update containers we opted in
      - WATCHTOWER_CLEANUP=true               # remove old images
      - WATCHTOWER_POLL_INTERVAL=120          # check GHCR every 2 min
      - WATCHTOWER_INCLUDE_RESTARTING=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro   # GHCR auth for private images
    networks: [internal]

  # ── Nightly backup (opt-in: `--profile backup`) ────────────────────────────
  # Runs api-backup.js on startup then every 24 h. Stores encrypted files in
  # backup_data volume. Set BACKUP_S3_BUCKET to also push offsite.
  backup:
    image: ${API_IMAGE:-ghcr.io/jitendramindset/jeetmantraclaude:latest}
    container_name: eduos_backup
    profiles: [backup]
    restart: always
    working_dir: /app
    entrypoint: ["/bin/sh", "-c",
      "node scripts/api-backup.js && while true; do sleep 86400 && node scripts/api-backup.js; done"]
    environment:
      - SUPABASE_URL
      - SUPABASE_SERVICE_ROLE_KEY
      - BACKUP_ENCRYPT_KEY
      - BACKUP_S3_BUCKET
      - BACKUP_S3_REGION=ap-south-1
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
    volumes:
      - backup_data:/app/backups
    networks: [internal]

  # ── MONITORING STACK (opt-in: `--profile monitoring`) ──────────────────────
  # Uptime, metrics, logs. Start with: ... up -d --profile monitoring
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: eduos_uptime
    profiles: [monitoring]
    restart: always
    volumes: [uptime_data:/app/data]
    networks: [edge, internal]
    labels:
      - traefik.enable=true
      - traefik.http.routers.uptime.rule=Host(`${UPTIME_DOMAIN}`)
      - traefik.http.routers.uptime.entrypoints=websecure
      - traefik.http.routers.uptime.tls.certresolver=le
      - traefik.http.services.uptime.loadbalancer.server.port=3001

  prometheus:
    image: prom/prometheus:latest
    container_name: eduos_prometheus
    profiles: [monitoring]
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [internal]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: eduos_cadvisor
    profiles: [monitoring]
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [internal]

  loki:
    image: grafana/loki:2.9.0
    container_name: eduos_loki
    profiles: [monitoring]
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    volumes: [loki_data:/loki]
    networks: [internal]

  promtail:
    image: grafana/promtail:2.9.0
    container_name: eduos_promtail
    profiles: [monitoring]
    restart: always
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [internal]

  grafana:
    image: grafana/grafana:latest
    container_name: eduos_grafana
    profiles: [monitoring]
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes: [grafana_data:/var/lib/grafana]
    depends_on: [prometheus, loki]
    networks: [edge, internal]
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`${GRAFANA_DOMAIN}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=le
      - traefik.http.services.grafana.loadbalancer.server.port=3000

volumes:
  letsencrypt:
  redis_data:
  n8n_data:
  backup_data:
  uptime_data:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  edge:
  internal:
