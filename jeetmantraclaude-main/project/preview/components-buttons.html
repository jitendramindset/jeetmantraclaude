<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f4f6f8; padding: 24px; }
  .section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #64748b; margin-bottom: 14px; margin-top: 22px; }
  .section-label:first-child { margin-top: 0; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

  /* Base button */
  .btn { display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; border-radius: 10px; transition: all 200ms cubic-bezier(0.4,0,0.2,1); text-decoration: none; }

  /* Sizes */
  .btn-sm  { font-size: 13px; padding: 8px 16px; border-radius: 8px; }
  .btn-md  { font-size: 15px; padding: 12px 24px; }
  .btn-lg  { font-size: 16px; padding: 14px 32px; border-radius: 12px; }
  .btn-xl  { font-size: 17px; padding: 16px 40px; border-radius: 14px; letter-spacing: 0.01em; }

  /* Variants */
  .btn-primary { background: #f97316; color: white; box-shadow: 0 0 20px rgba(249,115,22,0.25); }
  .btn-primary:hover { background: #ea6c0a; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(249,115,22,0.35); }
  .btn-primary:active { transform: scale(0.98); }

  .btn-navy { background: #0f172a; color: white; }
  .btn-navy:hover { background: #162d4a; transform: translateY(-1px); }

  .btn-outline { background: transparent; color: #f97316; border: 2px solid #f97316; }
  .btn-outline:hover { background: #fff7ed; }

  .btn-outline-navy { background: transparent; color: #0f172a; border: 2px solid #0f172a; }
  .btn-outline-navy:hover { background: #f0f4ff; }

  .btn-ghost { background: transparent; color: #0f172a; }
  .btn-ghost:hover { background: #e5e7eb; }

  .btn-amber { background: #fbbf24; color: #0f172a; }
  .btn-amber:hover { background: #f59e0b; transform: translateY(-1px); }

  .btn-disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }

  .divider { width: 1px; height: 32px; background: #e5e7eb; }
</style>
</head>
<body>

<div class="section-label">Primary Variants</div>
<div class="row">
  <button class="btn btn-primary btn-xl">JOIN NOW</button>
  <button class="btn btn-primary btn-lg">Book Free Demo</button>
  <button class="btn btn-primary btn-md">Enroll Today</button>
  <button class="btn btn-primary btn-sm">Apply</button>
</div>

<div class="section-label">Secondary Variants</div>
<div class="row">
  <button class="btn btn-navy btn-lg">Partner With Us</button>
  <button class="btn btn-amber btn-lg">Earn ₹5,000</button>
  <button class="btn btn-outline btn-lg">Learn More</button>
  <button class="btn btn-outline-navy btn-lg">View Courses</button>
  <button class="btn btn-ghost btn-lg">Cancel</button>
</div>

<div class="section-label">States</div>
<div class="row">
  <button class="btn btn-primary btn-md">Default</button>
  <button class="btn btn-primary btn-md" style="background:#ea6c0a;transform:translateY(-1px);box-shadow:0 4px 20px rgba(249,115,22,0.35)">Hover</button>
  <button class="btn btn-primary btn-md" style="transform:scale(0.98)">Pressed</button>
  <button class="btn btn-disabled btn-md" disabled>Disabled</button>
  <button class="btn btn-primary btn-md" style="opacity:0.7;cursor:wait">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><circle cx="12" cy="12" r="10" stroke-opacity="0.3"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>
    Loading…
  </button>
</div>

</body>
</html>
