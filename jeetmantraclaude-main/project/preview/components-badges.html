<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f4f6f8; padding: 24px; }
  .section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #64748b; margin-bottom: 12px; margin-top: 22px; }
  .section-label:first-child { margin-top: 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 4px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 9999px; padding: 4px 12px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
  .badge-rect { border-radius: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.7; }
</style>
</head>
<body>

<div class="section-label">Status Badges</div>
<div class="row">
  <span class="badge" style="background:#f0fdf4;color:#16a34a;"><span class="dot"></span>Enrolled</span>
  <span class="badge" style="background:#fff7ed;color:#ea6c0a;"><span class="dot"></span>In Progress</span>
  <span class="badge" style="background:#eff6ff;color:#2563eb;"><span class="dot"></span>Demo Booked</span>
  <span class="badge" style="background:#fef2f2;color:#dc2626;"><span class="dot"></span>Seats Full</span>
  <span class="badge" style="background:#f5f3ff;color:#7c3aed;"><span class="dot"></span>New Batch</span>
</div>

<div class="section-label">Label Tags</div>
<div class="row">
  <span class="badge" style="background:#f97316;color:white;">JEE 2025</span>
  <span class="badge" style="background:#0f172a;color:white;">NEET</span>
  <span class="badge" style="background:#fbbf24;color:#0f172a;">Earn ₹5,000</span>
  <span class="badge" style="background:#22c55e;color:white;">Free Demo</span>
  <span class="badge" style="background:#3b82f6;color:white;">AI Skills</span>
  <span class="badge" style="background:#e5e7eb;color:#374151;">Class 10</span>
</div>

<div class="section-label">Rectangular Tags</div>
<div class="row">
  <span class="badge badge-rect" style="background:#fff7ed;color:#f97316;border:1px solid #fed7aa;">Academic</span>
  <span class="badge badge-rect" style="background:#f0f4ff;color:#1e3a5f;border:1px solid #bfcfff;">Coaching</span>
  <span class="badge badge-rect" style="background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;">Sports</span>
  <span class="badge badge-rect" style="background:#fdf4ff;color:#9333ea;border:1px solid #e9d5ff;">AI Skills</span>
  <span class="badge badge-rect" style="background:#fffbeb;color:#d97706;border:1px solid #fde68a;">Earning</span>
</div>

<div class="section-label">Reward / Achievement Badges</div>
<div class="row">
  <span class="badge" style="background:linear-gradient(135deg,#fbbf24,#f97316);color:white;font-size:13px;padding:6px 16px;box-shadow:0 2px 8px rgba(249,115,22,0.3);">⭐ Top Earner</span>
  <span class="badge" style="background:linear-gradient(135deg,#0f172a,#1e3a5f);color:white;font-size:13px;padding:6px 16px;">🏆 JEE Champion</span>
  <span class="badge" style="background:linear-gradient(135deg,#22c55e,#16a34a);color:white;font-size:13px;padding:6px 16px;">100% Attendance</span>
</div>

</body>
</html>
