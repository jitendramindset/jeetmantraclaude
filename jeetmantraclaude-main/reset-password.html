<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — JeetMantra</title>
<style>
:root{--jm-primary:#7c3aed;--jm-border:#e5e3ed;--jm-text:#1a1325;--jm-text-muted:#6b6783}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:linear-gradient(135deg,#7c3aed 0%,#a855f7 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--jm-text)}
.card{background:#fff;border-radius:16px;padding:36px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.18)}
h1{font-size:24px;margin-bottom:8px}
.sub{color:var(--jm-text-muted);font-size:14px;margin-bottom:24px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input{width:100%;padding:11px 14px;border-radius:8px;border:1.5px solid var(--jm-border);font-size:14px;margin-bottom:16px}
input:focus{outline:0;border-color:var(--jm-primary)}
.btn{width:100%;padding:12px;border-radius:8px;background:var(--jm-primary);color:#fff;border:0;font-weight:600;cursor:pointer;font-size:15px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{padding:10px;border-radius:6px;font-size:13px;margin-bottom:14px;display:none}
.msg.ok{background:#dcfce7;color:#166534;display:block}
.msg.err{background:#fee2e2;color:#991b1b;display:block}
.foot{margin-top:18px;text-align:center}
a{color:var(--jm-primary);font-size:13px;text-decoration:none}
</style>
</head><body>
<div class="card">
  <h1>🔐 Set a new password</h1>
  <div class="sub">Pick something 8+ characters.</div>
  <div id="msg" class="msg"></div>
  <label>New password</label>
  <input type="password" id="pw" placeholder="••••••••">
  <label>Confirm password</label>
  <input type="password" id="pw2" placeholder="••••••••">
  <button class="btn" id="btn" onclick="submit()">Update password</button>
  <div class="foot"><a href="/login.html">← Back to login</a></div>
</div>
<script>
const token=new URLSearchParams(location.search).get('token');
if(!token){ document.getElementById('msg').className='msg err'; document.getElementById('msg').textContent='Missing reset token in URL.'; document.getElementById('btn').disabled=true; }
async function submit(){
  const pw=document.getElementById('pw').value, pw2=document.getElementById('pw2').value;
  const btn=document.getElementById('btn'), msg=document.getElementById('msg');
  msg.className='msg'; msg.textContent='';
  if(pw.length<8){ msg.className='msg err'; msg.textContent='Password must be 8+ chars'; return; }
  if(pw!==pw2){ msg.className='msg err'; msg.textContent='Passwords don\'t match'; return; }
  btn.disabled=true; btn.textContent='Updating…';
  try{
    const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:pw})});
    const j=await r.json();
    if(!r.ok){ msg.className='msg err'; msg.textContent=j.error||'Failed'; btn.disabled=false; btn.textContent='Update password'; return; }
    msg.className='msg ok'; msg.textContent=j.message||'Password updated.';
    setTimeout(()=>location.href='/login.html',1500);
  }catch(e){ msg.className='msg err'; msg.textContent='Network error'; btn.disabled=false; btn.textContent='Update password'; }
}
</script><script src="/i18n-lite.js" defer></script>
</body></html>
