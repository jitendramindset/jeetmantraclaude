<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeetMantra — Loading…</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    html,body{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.25rem}
    .logo{font-size:2.25rem;font-weight:800;color:var(--jm-text);letter-spacing:-0.02em}
    .logo .accent{color:var(--jm-primary)}
    .spin{width:38px;height:38px;border:3px solid var(--jm-border);border-top-color:var(--jm-primary);
      border-radius:50%;animation:r .8s linear infinite}
    @keyframes r{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="logo">Jeet<span class="accent">Mantra</span></div>
  <div class="spin"></div>
  <script>
    // Entry router: send logged-in users to their dashboard, others to landing/login.
    (function () {
      var token = localStorage.getItem('jm_token');
      var user = null;
      try { user = JSON.parse(localStorage.getItem('jm_user') || 'null'); } catch (e) {}
      if (token && user) {
        var role = user.user_type || user.role || 'student';
        window.location.replace(role === 'admin' ? '/admin.html' : '/dashboard.html?role=' + role);
      } else {
        window.location.replace('/website.html');
      }
    })();
  </script>
<script src="/i18n-seed.js?v=3"></script>
<script src="/i18n-lite.js?v=3" defer></script>
</body>
</html>
