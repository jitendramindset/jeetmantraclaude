<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JeetMantra · AI Dev Control Center</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--jm-primary:#7c3aed;--bg:#0b1220;--surface:#0f172a;--surface2:#131e36;--bd:#1e293b;--tx:#e2e8f0;--mu:#94a3b8;
    --crit:#ef4444;--major:#f59e0b;--medium:#3b82f6;--minor:#64748b;--ok:#22c55e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  h1{font-size:22px;font-weight:900;letter-spacing:-.4px}
  h1 span{color:var(--jm-primary)}
  .sub{font-size:12px;color:var(--mu);margin-top:3px}
  .gauge{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--bd);border-radius:14px;padding:14px 18px}
  .ring{--p:0;width:62px;height:62px;border-radius:50%;background:conic-gradient(var(--jm-primary) calc(var(--p)*1%),#1e293b 0);display:flex;align-items:center;justify-content:center;position:relative}
  .ring::after{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
  .ring b{position:relative;z-index:1;font-size:16px;font-weight:900}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--bd);border-radius:14px;padding:18px}
  .card h2{font-size:14px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .mod{margin-bottom:12px}
  .mod .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .mod .note{font-size:11px;color:var(--mu);margin-top:3px}
  .bar{height:7px;border-radius:6px;background:#1e293b;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:6px 0 0 6px;background:linear-gradient(90deg,var(--jm-primary),#a855f7)}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--bd);background:transparent;color:var(--mu);cursor:pointer;transition:all .15s}
  .chip:hover{border-color:var(--jm-primary);color:var(--jm-primary)}
  .chip:focus-visible{outline:2px solid var(--jm-primary);outline-offset:2px}
  .chip.active{background:var(--jm-primary);border-color:var(--jm-primary);color:#fff}
  .issue{border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:8px;border-left-width:4px}
  .issue.crit{border-left-color:var(--crit)} .issue.major{border-left-color:var(--major)}
  .issue.medium{border-left-color:var(--medium)} .issue.minor{border-left-color:var(--minor)}
  .issue .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .issue .id{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mu)}
  .issue .title{font-weight:700;font-size:13px}
  .issue .detail{font-size:11px;color:var(--mu);margin-top:4px;line-height:1.5}
  .issue .fix{font-size:11px;margin-top:6px;color:#cbd5e1}
  .issue .fix b{color:var(--ok)}
  .sev{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:6px}
  .sev.crit{background:rgba(239,68,68,.15);color:#fca5a5} .sev.major{background:rgba(245,158,11,.15);color:#fcd34d}
  .sev.medium{background:rgba(59,130,246,.15);color:#93c5fd} .sev.minor{background:rgba(100,116,139,.2);color:#cbd5e1}
  .st{font-size:9px;font-weight:800;padding:2px 7px;border-radius:6px}
  .st.fixed{background:rgba(34,197,94,.15);color:#86efac} .st.open{background:rgba(148,163,184,.22);color:#e2e8f0}
  .next li{font-size:13px;padding:8px 0;border-bottom:1px solid var(--bd);display:flex;gap:8px}
  .next li:last-child{border:none}
  .next li::before{content:'→';color:var(--jm-primary);font-weight:900}
  .legend{font-size:11px;color:var(--mu);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}
  .agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:10px}
  .agent{background:var(--surface2);border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:12px}
  .agent .nm{font-weight:800;margin-bottom:4px}
  .agent .ck{font-size:10px;color:var(--mu);line-height:1.6}
  a.back{font-size:12px;color:var(--jm-primary);text-decoration:none;font-weight:700}
  .err{background:var(--surface);border:1px solid var(--bd);border-radius:12px;padding:24px;text-align:center;color:var(--mu)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🛰️ JeetMantra <span>AI Dev Control Center</span></h1>
      <div class="sub" id="meta">Loading audit report…</div>
      <a class="back" href="/dashboard.html">← Back to dashboard</a>
    </div>
    <div class="gauge">
      <div class="ring" id="ring"><b id="ringPct">—</b></div>
      <div><div style="font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.6px">Overall</div><div style="font-size:13px;font-weight:700">Production readiness</div></div>
    </div>
  </header>

  <div id="content"></div>
</div>

<script>
async function load(){
  let data;
  try { data = await (await fetch('/audit-report.json?ts='+Date.now())).json(); }
  catch(e){ document.getElementById('content').innerHTML = '<div class="err">Could not load <code>audit-report.json</code>. Re-run the audit to regenerate it.</div>'; return; }

  document.getElementById('meta').textContent = data.project + ' · audit ' + data.generatedAt + ' · ' + data.issues.length + ' tracked issues';
  document.getElementById('ring').style.setProperty('--p', data.overallCompletion);
  document.getElementById('ringPct').textContent = data.overallCompletion + '%';

  const sevOrder = { critical:0, major:1, medium:2, minor:3 };
  const sevClass = { critical:'crit', major:'major', medium:'medium', minor:'minor' };
  const counts = data.issues.reduce((a,i)=>{ if(i.status!=='fixed'){a[i.severity]=(a[i.severity]||0)+1;} return a; }, {});
  let filter = 'all';

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function issuesHtml(){
    const list = data.issues
      .filter(i => filter==='all' ? true : (filter==='fixed' ? i.status==='fixed' : i.severity===filter && i.status!=='fixed'))
      .sort((a,b)=> (a.status==='fixed')-(b.status==='fixed') || sevOrder[a.severity]-sevOrder[b.severity]);
    if(!list.length) return '<div style="font-size:12px;color:var(--mu);padding:12px">Nothing here. 🎉</div>';
    return list.map(i=>`
      <div class="issue ${sevClass[i.severity]}">
        <div class="row1">
          <span class="title">${esc(i.title)}</span>
          <span style="display:flex;gap:6px;flex-shrink:0">
            <span class="sev ${sevClass[i.severity]}">${i.severity}</span>
            <span class="st ${i.status==='fixed'?'fixed':'open'}">${i.status==='fixed'?'✓ fixed':'open'}</span>
          </span>
        </div>
        <div class="id">${esc(i.id)} · ${esc(i.category)}</div>
        <div class="detail">${esc(i.detail)}</div>
        <div class="fix">${i.status==='fixed'?'<b>✓ '+esc(i.fix)+'</b>':'🔧 '+esc(i.fix)}</div>
      </div>`).join('');
  }

  function render(){
    document.getElementById('content').innerHTML = `
      <div class="grid">
        <div class="card">
          <h2>📦 Module completion</h2>
          ${data.modules.map(m=>`
            <div class="mod">
              <div class="top"><span>${esc(m.label)}</span><b>${m.progress}%</b></div>
              <div class="bar"><i style="width:${m.progress}%"></i></div>
              <div class="note">${esc(m.note)}</div>
            </div>`).join('')}
        </div>
        <div>
          <div class="card" style="margin-bottom:16px">
            <h2>🎯 Next recommended actions</h2>
            <ul class="next" style="list-style:none">${data.nextActions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>
          </div>
          <div class="card">
            <h2>🤖 Audit agents (re-run each pass)</h2>
            <div class="agents">
              ${[['UI Auditor','padding · alignment · colors · typography'],
                 ['UX Auditor','navigation · flows · onboarding · empty states'],
                 ['CRUD Auditor','missing APIs · validation · forms · delete/update'],
                 ['Responsive Auditor','mobile · tablet · smartboard · desktop'],
                 ['Performance Auditor','slow screens · large images · N+1 · API delays'],
                 ['Smartboard Auditor','region share · canvas crop · annotate · record']
                ].map(([n,c])=>`<div class="agent"><div class="nm">${n}</div><div class="ck">${c}</div></div>`).join('')}
            </div>
          </div>
        </div>
      </div>
      <div class="card" style="margin-top:16px">
        <h2>🐞 Issue backlog</h2>
        <div class="filters">
          ${['all','critical','major','medium','minor','fixed'].map(f=>{
            const n = f==='all' ? data.issues.filter(i=>i.status!=='fixed').length
                    : f==='fixed' ? data.issues.filter(i=>i.status==='fixed').length
                    : (counts[f]||0);
            return `<button class="chip ${f===filter?'active':''}" data-f="${f}">${f} · ${n}</button>`;
          }).join('')}
        </div>
        <div id="issueList">${issuesHtml()}</div>
        <div class="legend">
          <span>🔴 critical</span><span>🟠 major</span><span>🔵 medium</span><span>⚪ minor</span>
          <span style="margin-left:auto">This board regenerates from <code>audit-report.json</code> on each audit pass.</span>
        </div>
      </div>`;
    document.querySelectorAll('.chip').forEach(c=> c.onclick = ()=>{ filter=c.dataset.f; render(); });
  }
  render();
}
load();
</script>
<script src="/i18n-lite.js" defer></script>
</body>
</html>
