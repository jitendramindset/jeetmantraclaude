<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JeetMantra — Your Workspace</title>
<link rel="stylesheet" href="theme.css">
<style>
/* Widget dashboard — composed by widget-registry.js from /api/me/contexts */
nav{background:var(--jm-surface);border-bottom:1px solid var(--jm-border);padding:14px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50;box-shadow:var(--jm-shadow-sm)}
nav .logo{font-size:20px;font-weight:800;text-decoration:none;color:var(--jm-text);letter-spacing:-.02em}
nav .logo .accent{color:var(--jm-primary)}
nav .sp{flex:1}
nav a.lk{color:var(--jm-text-strong);text-decoration:none;font-size:13px;font-weight:600}
nav a.lk:hover{color:var(--jm-primary)}
.wrap{max-width:1280px;margin:0 auto;padding:24px 28px 64px}
.wg-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.wg-header h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.role-chips{display:flex;gap:6px;flex-wrap:wrap}
.role-chip{font-size:11px;font-weight:700;text-transform:capitalize;background:var(--jm-primary-tint,#ede9fe);color:var(--jm-primary);padding:4px 10px;border-radius:999px}
/* GRID — sizes map to column spans; engine sorts by priority */
.wg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start}
.wg-card{background:var(--jm-surface);border:1px solid var(--jm-border);border-radius:var(--jm-radius);padding:16px;box-shadow:var(--jm-shadow-sm);animation:wgUp .35s ease both}
.wg-card.wg-pinned{border-color:var(--jm-primary)}
.wg-small{grid-column:span 1}.wg-medium{grid-column:span 2}.wg-large{grid-column:span 3}.wg-full{grid-column:1/-1}
.wg-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wg-title{font-size:13px;font-weight:800;letter-spacing:-.01em}
.wg-pin{font-size:12px}
.wg-body{font-size:13px;color:var(--jm-text-strong)}
.wg-big{font-size:30px;font-weight:800;color:var(--jm-primary);line-height:1.1}
.wg-sub{font-size:12px;color:var(--jm-text-muted);margin-top:2px}
.wg-link{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;color:var(--jm-primary);text-decoration:none}
.wg-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--jm-border);text-decoration:none;color:var(--jm-text-strong)}
.wg-row:last-child{border-bottom:none}
.wg-row-t{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wg-row-x{font-size:11px;color:var(--jm-text-muted);white-space:nowrap}
.wg-bar{flex:0 0 70px;height:6px;background:var(--jm-surface-2,#eef);border-radius:4px;overflow:hidden}
.wg-bar i{display:block;height:100%;background:var(--jm-primary)}
.wg-empty{color:var(--jm-text-muted);font-size:13px;padding:6px 0}
.wg-actions{display:flex;flex-wrap:wrap;gap:10px}
.wg-action{display:inline-block;padding:9px 14px;border-radius:var(--jm-radius-sm);background:var(--jm-primary);color:#fff;font-size:13px;font-weight:700;text-decoration:none;box-shadow:0 2px 8px var(--jm-primary-glow)}
.wg-action:hover{background:var(--jm-primary-2)}
.wg-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.wg-mini{display:block;padding:10px;border:1px solid var(--jm-border);border-radius:10px;text-decoration:none;color:var(--jm-text-strong)}
.wg-mini:hover{border-color:var(--jm-primary)}
.wg-mini-t{font-weight:700;font-size:12px;line-height:1.3;margin-bottom:4px}
.wg-mini-x{font-size:11px;color:var(--jm-text-muted)}
.wg-skel{height:14px;border-radius:6px;margin-bottom:10px;background:linear-gradient(90deg,rgba(150,150,150,.12) 25%,rgba(150,150,150,.22) 37%,rgba(150,150,150,.12) 63%);background-size:400% 100%;animation:wgSh 1.4s ease infinite}
.wg-skel.w60{width:60%}
@keyframes wgSh{0%{background-position:100% 0}100%{background-position:-100% 0}}
@keyframes wgUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:1024px){.wg-grid{grid-template-columns:repeat(2,1fr)}.wg-medium,.wg-large,.wg-full{grid-column:1/-1}}
@media(max-width:560px){.wg-grid{grid-template-columns:1fr}.wg-small{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<script src="/jm-theme.js"></script>
</head>
<body>
<nav>
  <a href="/" class="logo">Jeet<span class="accent">Mantra</span></a>
  <div class="sp"></div>
  <a class="lk" href="/dashboard.html">Classic dashboard</a>
</nav>

<div class="wrap">
  <div class="wg-header">
    <h1 id="wgGreeting">Your Workspace</h1>
    <div class="role-chips" id="roleChips"></div>
  </div>
  <div class="wg-grid" id="wgGrid">
    <div class="wg-card wg-full"><div class="wg-body"><div class="wg-skel"></div><div class="wg-skel w60"></div></div></div>
  </div>
</div>

<script src="/widget-registry.js"></script>
<script>
(async () => {
  const grid = document.getElementById('wgGrid');
  try {
    const u = JSON.parse(localStorage.getItem('jm_user') || '{}');
    if (u.fullName || u.full_name) document.getElementById('wgGreeting').textContent = 'Welcome, ' + (u.fullName || u.full_name).split(' ')[0];
    const { ctx } = await EduOSWidgets.boot(grid) || {};
    if (ctx) {
      const roles = [...new Set([...(ctx.roles || []), ...((ctx.contexts || []).flatMap(c => c.my_roles || []))])];
      document.getElementById('roleChips').innerHTML = roles.map(r => `<span class="role-chip">${EduOSWidgets.esc(r)}</span>`).join('');
    }
  } catch (e) {
    grid.innerHTML = '<div class="wg-card wg-full"><div class="wg-body wg-empty">Could not load your workspace. <a href="/login.html">Sign in</a>.</div></div>';
  }
})();
</script>
</body>
</html>
