<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JeetMantra — Your Workspace</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="widget-styles.css">
<style>
/* widgets.html page chrome only — widget styles live in widget-styles.css */
nav{background:var(--jm-surface);border-bottom:1px solid var(--jm-border);padding:14px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50;box-shadow:var(--jm-shadow-sm)}
nav .logo{font-size:20px;font-weight:800;text-decoration:none;color:var(--jm-text);letter-spacing:-.02em}
nav .logo .accent{color:var(--jm-primary)}
nav .sp{flex:1}
nav a.lk{color:var(--jm-text-strong);text-decoration:none;font-size:13px;font-weight:600}
nav a.lk:hover{color:var(--jm-primary)}
.wrap{max-width:1280px;margin:0 auto;padding:24px 28px 64px}
.wg-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.wg-header h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.role-chips{display:flex;gap:6px;flex-wrap:wrap}
.role-chip{font-size:11px;font-weight:700;text-transform:capitalize;background:var(--jm-primary-tint,#ede9fe);color:var(--jm-primary);padding:4px 10px;border-radius:999px}
.cmd-bar{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.cmd-bar input{flex:1;max-width:440px;font-size:13px;background:var(--jm-surface);border:1px solid var(--jm-border);border-radius:8px;padding:8px 12px;color:var(--jm-text-strong);outline:none}
.cmd-bar button{font-size:14px;background:var(--jm-surface);border:1px solid var(--jm-border);border-radius:8px;padding:7px 11px;cursor:pointer}
</style>
<script src="/jm-theme.js"></script>
</head>
<body>
<nav>
  <a href="/" class="logo">Jeet<span class="accent">Mantra</span></a>
  <div class="sp"></div>
  <a class="lk" href="/dashboard.html">Classic dashboard</a>
</nav>

<div class="wrap">
  <div class="wg-header">
    <h1 id="wgGreeting">Your Workspace</h1>
    <div class="role-chips" id="roleChips"></div>
  </div>
  <div class="cmd-bar">
    <input id="wgCmd" type="text" placeholder="Ask or command… e.g. show revenue, today's classes" aria-label="Command palette"
      onkeydown="if(event.key==='Enter'){EduOSWidgets.handleCommand(this.value);this.value='';}">
    <button type="button" title="Voice command" aria-label="Voice command" onclick="if(!EduOSWidgets.listen())alert('Voice not supported in this browser')">🎤</button>
  </div>
  <div class="wg-grid" id="wgGrid">
    <div class="wg-card wg-full"><div class="wg-body"><div class="wg-skel"></div><div class="wg-skel w60"></div></div></div>
  </div>
  <div class="wg-add-tray" id="wgAddTray"></div>
</div>

<script src="/widget-registry.js"></script>
<script>
(async () => {
  const grid = document.getElementById('wgGrid');
  try {
    const u = JSON.parse(localStorage.getItem('jm_user') || '{}');
    if (u.fullName || u.full_name) document.getElementById('wgGreeting').textContent = 'Welcome, ' + (u.fullName || u.full_name).split(' ')[0];
    const { ctx } = await EduOSWidgets.boot(grid) || {};
    if (ctx) {
      const roles = [...new Set([...(ctx.roles || []), ...((ctx.contexts || []).flatMap(c => c.my_roles || []))])];
      document.getElementById('roleChips').innerHTML = roles.map(r => `<span class="role-chip">${EduOSWidgets.esc(r)}</span>`).join('');
    }
  } catch (e) {
    grid.innerHTML = '<div class="wg-card wg-full"><div class="wg-body wg-empty">Could not load your workspace. <a href="/login.html">Sign in</a>.</div></div>';
  }
})();
</script>
<script src="/jm-nav.js" defer></script>
</body>
</html>
