<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — JeetMantra</title>
<link rel="stylesheet" href="/premium-ui.css?v=5">
<script src="/ui/widgets/page/AuthShell.js?v=1"></script>
<script>document.write('<style>'+JM.AuthShell.css()+'</style>');</script>
</head><body>
<script>
document.write(JM.AuthShell({
  title: '🔑 Forgot password?',
  sub: "Enter your email and we'll send a reset link.",
  body: '<div id="msg" class="jm-auth-msg"></div>'
      + '<label>Email</label>'
      + '<input type="email" id="email" placeholder="you@example.com">'
      + '<button class="jm-auth-btn" id="btn" onclick="send()">Send reset link</button>',
  footer: '<a href="/login.html">← Back to login</a>'
}));
</script>
<script>
async function send(){
  const email=document.getElementById('email').value.trim();
  const btn=document.getElementById('btn'), msg=document.getElementById('msg');
  msg.className='jm-auth-msg'; msg.textContent='';
  if(!email){ msg.className='jm-auth-msg err'; msg.textContent='Email required'; return; }
  btn.disabled=true; btn.textContent='Sending…';
  try{
    const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const j=await r.json();
    msg.className='jm-auth-msg ok';
    msg.textContent=j.message || 'If that email exists, a reset link has been sent.';
  }catch(e){ msg.className='jm-auth-msg err'; msg.textContent='Network error'; }
  finally{ btn.disabled=false; btn.textContent='Send reset link'; }
}
</script>
<script src="/i18n-seed.js?v=4"></script>
<script src="/i18n-lite.js?v=4" defer></script>
</body></html>
