<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — JeetMantra</title>
<style>
:root{--jm-primary:#7c3aed;--jm-bg:#f8f7fc;--jm-surface:#fff;--jm-border:#e5e3ed;--jm-text:#1a1325;--jm-text-muted:#6b6783}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:linear-gradient(135deg,#7c3aed 0%,#a855f7 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--jm-text)}
.card{background:#fff;border-radius:16px;padding:36px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.18)}
h1{font-size:24px;margin-bottom:8px}
.sub{color:var(--jm-text-muted);font-size:14px;margin-bottom:24px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input{width:100%;padding:11px 14px;border-radius:8px;border:1.5px solid var(--jm-border);font-size:14px;margin-bottom:16px}
input:focus{outline:0;border-color:var(--jm-primary)}
.btn{width:100%;padding:12px;border-radius:8px;background:var(--jm-primary);color:#fff;border:0;font-weight:600;cursor:pointer;font-size:15px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{padding:10px;border-radius:6px;font-size:13px;margin-bottom:14px;display:none}
.msg.ok{background:#dcfce7;color:#166534;display:block}
.msg.err{background:#fee2e2;color:#991b1b;display:block}
a{color:var(--jm-primary);font-size:13px;text-decoration:none}
.foot{margin-top:18px;text-align:center}
</style>
<link rel="stylesheet" href="/premium-ui.css?v=5">
<script src="/jm-states.js"></script>
</head><body>
<div class="card">
  <h1>🔑 Forgot password?</h1>
  <div class="sub">Enter your email and we'll send a reset link.</div>
  <div id="msg" class="msg"></div>
  <label>Email</label>
  <input type="email" id="email" placeholder="you@example.com">
  <button class="btn" id="btn" onclick="send()">Send reset link</button>
  <div class="foot"><a href="/login.html">← Back to login</a></div>
</div>
<script>
async function send(){
  const email=document.getElementById('email').value.trim();
  const btn=document.getElementById('btn'), msg=document.getElementById('msg');
  msg.className='msg'; msg.textContent='';
  if(!email){ msg.className='msg err'; msg.textContent='Email required'; return; }
  btn.disabled=true; btn.textContent='Sending…';
  try{
    const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const j=await r.json();
    msg.className='msg ok';
    msg.textContent=j.message || 'If that email exists, a reset link has been sent.';
  }catch(e){ msg.className='msg err'; msg.textContent='Network error'; }
  finally{ btn.disabled=false; btn.textContent='Send reset link'; }
}
</script><script src="/i18n-seed.js?v=4"></script>
<script src="/i18n-lite.js?v=4" defer></script>
</body></html>
