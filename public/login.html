<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JeetMantra — Login</title>
<link rel="stylesheet" href="theme.css">
<style>
/* Login page — uses theme.css design tokens */
/* Branded background plane: accent gradient + soft glow blobs, shared with
   the website hero palette so the login feels like one product. */
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 55%,#7c2d12 100%)}
body::before{content:'';position:absolute;top:-220px;right:-180px;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle,rgba(249,115,22,.30),transparent 70%);pointer-events:none}
body::after{content:'';position:absolute;bottom:-200px;left:-160px;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(251,191,36,.16),transparent 70%);pointer-events:none}
.container{width:100%;max-width:440px;position:relative;z-index:1}
.logo h1{color:#fff !important}
.logo p{color:rgba(255,255,255,.55) !important}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:30px;font-weight:800;color:var(--jm-text);letter-spacing:-0.02em}
.logo h1 .accent{color:var(--jm-primary)}
.logo p{color:var(--jm-text-muted);font-size:14px;margin-top:6px}
.card{background:var(--jm-surface);border-radius:16px;padding:32px;border:1px solid var(--jm-border);box-shadow:var(--jm-shadow)}
.tabs{display:flex;border-radius:var(--jm-radius-sm);background:var(--jm-surface-2);padding:4px;margin-bottom:28px}
.tab{flex:1;padding:10px;text-align:center;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;transition:all .15s;color:var(--jm-text-muted)}
.tab.active{background:var(--jm-primary);color:#fff;box-shadow:0 2px 8px var(--jm-primary-glow)}
.tab:focus-visible{outline:2px solid var(--jm-primary);outline-offset:2px}
.btn:focus-visible{outline:2px solid var(--jm-primary);outline-offset:2px}
.btn-social:focus-visible{outline:2px solid var(--jm-primary);outline-offset:2px}
.form-group{margin-bottom:16px}
label{display:block;font-size:13px;color:var(--jm-text-strong);margin-bottom:6px;font-weight:600}
input,select{width:100%;background:var(--jm-surface);border:1.5px solid var(--jm-border);border-radius:var(--jm-radius-sm);padding:12px 14px;color:var(--jm-text);font-size:14px;outline:none;font-family:inherit;transition:all .15s}
input:focus,select:focus{border-color:var(--jm-primary);box-shadow:0 0 0 3px rgba(249,115,22,0.12)}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.role-card{background:var(--jm-surface);border:1.5px solid var(--jm-border);border-radius:var(--jm-radius-sm);padding:12px 8px;text-align:center;cursor:pointer;transition:all .15s}
.role-card:hover{border-color:var(--jm-primary)}
.role-card:focus-visible{outline:2px solid var(--jm-primary);outline-offset:2px}
.role-card.selected{border-color:var(--jm-primary);background:var(--jm-primary-tint)}
.role-card .icon{font-size:24px;margin-bottom:4px}
.role-card .label{font-size:11px;color:var(--jm-text-strong);font-weight:600}
.btn{width:100%;padding:13px;border:none;border-radius:var(--jm-radius-sm);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;margin-top:8px}
.btn-primary{background:var(--jm-primary);color:#fff;box-shadow:0 2px 12px var(--jm-primary-glow)}
.btn-primary:hover{background:var(--jm-primary-2);box-shadow:0 4px 18px var(--jm-primary-glow)}
.btn-primary:disabled{background:var(--jm-text-subtle);cursor:not-allowed;box-shadow:none}
.divider{text-align:center;color:var(--jm-text-muted);margin:16px 0;font-size:13px;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:var(--jm-border)}
.divider::before{left:0}.divider::after{right:0}
.social-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.btn-social{background:var(--jm-surface);border:1.5px solid var(--jm-border);color:var(--jm-text);border-radius:var(--jm-radius-sm);padding:11px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;transition:all .15s}
.btn-social:hover{border-color:var(--jm-primary);color:var(--jm-primary)}
.otp-section{display:none}
.otp-input{letter-spacing:6px;text-align:center;font-size:20px;font-weight:700}
.msg{padding:10px 14px;border-radius:var(--jm-radius-sm);font-size:13px;margin-bottom:12px;display:none;font-weight:600}
.msg.error{background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5}
.msg.success{background:#f0fdf4;color:#15803d;border:1px solid #86efac}
.forgot{text-align:right;margin-top:-8px;margin-bottom:16px}
.forgot a{color:var(--jm-text-muted);font-size:12px;text-decoration:none}
.forgot a:hover{color:var(--jm-primary)}
.switch{text-align:center;margin-top:20px;font-size:13px;color:var(--jm-text-muted)}
.switch a{color:var(--jm-primary);text-decoration:none;font-weight:600}
.loading{display:none;text-align:center;color:var(--jm-text-muted);font-size:14px;margin-top:8px}
.loading::before{content:"";display:inline-block;width:14px;height:14px;margin-right:8px;vertical-align:-2px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.loading::before{animation-duration:.01ms}}
@media(max-width:480px){
  body{padding:12px}
  .card{padding:22px 18px;border-radius:12px}
  .role-grid{grid-template-columns:1fr 1fr}
  .social-btns{grid-template-columns:1fr}
  input,select{font-size:16px}        /* ≥16px prevents iOS zoom-on-focus */
  .btn{font-size:16px}
}
</style>
<script src="/jm-theme.js"></script>
<!-- Google Identity Services — loaded async; init deferred until config fetch -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="container">
  <div class="logo">
    <h1>Jeet<span class="accent">Mantra</span></h1>
    <p>India's Modern Gurukul</p>
  </div>
  <div class="card">
    <div class="tabs">
      <div class="tab active" role="button" tabindex="0" aria-label="Login" onclick="switchTab('login')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">Login</div>
      <div class="tab" role="button" tabindex="0" aria-label="Go to sign up" onclick="location.href='/signup.html'" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">Sign Up</div>
    </div>
    <div id="msg" class="msg"></div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
      </div>
      <div class="forgot"><a href="/forgot-password.html">Forgot password?</a></div>
      <button class="btn btn-primary" onclick="doLogin()" id="loginBtn">Login</button>
      <div class="divider">or continue with</div>
      <div class="social-btns">
        <button class="btn-social" id="googleBtn" onclick="doGoogleLogin()" aria-label="Continue with Google">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615Z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58Z"/></svg>
        Google
      </button>
        <button class="btn-social" onclick="showOTP()" aria-label="Login with phone OTP">📱 Phone OTP</button>
      </div>
      <div class="otp-section" id="otpSection">
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="otpPhone" placeholder="+91 XXXXX XXXXX">
        </div>
        <button class="btn btn-primary" onclick="sendOTP()" id="sendOtpBtn">Send OTP</button>
        <div class="form-group" id="otpVerifyGroup" style="display:none;margin-top:12px">
          <label>Enter OTP</label>
          <input type="text" id="otpCode" class="otp-input" placeholder="000000" maxlength="6">
          <button class="btn btn-primary" onclick="verifyOTP()" style="margin-top:10px">Verify & Login</button>
        </div>
      </div>
      <div class="loading" id="loginLoading">🔐 Signing in...</div>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupForm" style="display:none">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signupName" placeholder="Your full name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password (min 8 chars)</label>
        <input type="password" id="signupPassword" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label>Phone (optional)</label>
        <input type="tel" id="signupPhone" placeholder="+91 XXXXX XXXXX">
      </div>
      <div class="form-group">
        <label>I am a...</label>
        <div class="role-grid">
          <div class="role-card selected" onclick="selectRole('student',this)"><div class="icon">🎓</div><div class="label">Student</div></div>
          <div class="role-card" onclick="selectRole('teacher',this)"><div class="icon">👨‍🏫</div><div class="label">Teacher</div></div>
          <div class="role-card" onclick="selectRole('partner',this)"><div class="icon">🤝</div><div class="label">Partner</div></div>
          <div class="role-card" onclick="selectRole('school',this)"><div class="icon">🏫</div><div class="label">School</div></div>
          <div class="role-card" onclick="selectRole('coaching',this)"><div class="icon">🏆</div><div class="label">Coaching</div></div>
          <div class="role-card" onclick="selectRole('admin',this)"><div class="icon">⚙️</div><div class="label">Admin</div></div>
        </div>
        <input type="hidden" id="selectedRole" value="student">
      </div>
      <button class="btn btn-primary" onclick="doSignup()" id="signupBtn">Create Account</button>
      <div class="loading" id="signupLoading">🔐 Creating account...</div>
    </div>
  </div>
  <div class="switch">
    Don't have an account? <a href="/signup.html">Sign up free</a>
  </div>
</div>

<script>
const API = window.location.origin+'/api';

// Extract a human-readable message from any error shape the backend may
// return — never let an object stringify to "[object Object]".
function extractError(data, fallback) {
  if (!data) return fallback;
  if (typeof data === 'string') return data;
  // { error: "string" }
  if (typeof data.error === 'string') return data.error;
  // { error: { message: "..." } } or nested objects
  if (data.error && typeof data.error === 'object') {
    return data.error.message || data.error.error || JSON.stringify(data.error);
  }
  // { message: "..." } (some APIs)
  if (typeof data.message === 'string' && data.message !== 'Internal Server Error') return data.message;
  // Validation: { error: 'Validation failed', details: [{field, message}] }
  if (Array.isArray(data.details) && data.details.length) {
    return data.details.map(d => `${d.field || 'field'}: ${d.message || d}`).join('; ');
  }
  return fallback;
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='signup')));
  document.getElementById('loginForm').style.display = tab==='login'?'block':'none';
  document.getElementById('signupForm').style.display = tab==='signup'?'block':'none';
  hideMsg();
}

function selectRole(role, el) {
  document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('selectedRole').value = role;
}

function showMsg(text, type) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg ' + type;
  m.style.display = 'block';
}
function hideMsg() { document.getElementById('msg').style.display = 'none'; }

function storeAuth(token, user) {
  localStorage.setItem('jm_token', token);
  localStorage.setItem('jm_user', JSON.stringify(user));
}

function redirectToDashboard(role) {
  const dashUrl = '/dashboard.html?role=' + (role || 'student');
  setTimeout(() => { window.location.href = dashUrl; }, 800);
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) return showMsg('Please enter email and password', 'error');

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  document.getElementById('loginLoading').style.display = 'block';
  hideMsg();

  try {
    const res = await fetch(API + '/auth/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(extractError(data, 'Login failed'));
    storeAuth(data.token, data.user);
    showMsg('✅ Login successful! Redirecting...', 'success');
    redirectToDashboard(data.user.role);
  } catch (e) {
    showMsg(e.message, 'error');
    btn.disabled = false;
  }
  document.getElementById('loginLoading').style.display = 'none';
}

async function doSignup() {
  const fullName = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  const phone = document.getElementById('signupPhone').value.trim();
  const role = document.getElementById('selectedRole').value;

  if (!fullName || !email || !password) return showMsg('Please fill all required fields', 'error');
  if (password.length < 8) return showMsg('Password must be at least 8 characters', 'error');

  const btn = document.getElementById('signupBtn');
  btn.disabled = true;
  document.getElementById('signupLoading').style.display = 'block';
  hideMsg();

  try {
    const res = await fetch(API + '/auth/signup', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, password, fullName, role, phone: phone || undefined })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(extractError(data, 'Signup failed'));
    storeAuth(data.token, data.user);
    showMsg('✅ Account created! Redirecting...', 'success');
    redirectToDashboard(data.user.role);
  } catch (e) {
    showMsg(e.message, 'error');
    btn.disabled = false;
  }
  document.getElementById('signupLoading').style.display = 'none';
}

function showOTP() {
  const sec = document.getElementById('otpSection');
  sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
}

async function sendOTP() {
  const phone = document.getElementById('otpPhone').value.trim();
  if (!phone) return showMsg('Enter phone number', 'error');
  const btn = document.getElementById('sendOtpBtn');
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    const res = await fetch(API + '/auth/send-otp', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ phone })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(extractError(data, 'Could not send OTP'));
    document.getElementById('otpVerifyGroup').style.display = 'block';
    showMsg('OTP sent to **' + data.phone + ' (check console for dev OTP)', 'success');
  } catch (e) {
    showMsg(e.message, 'error');
  }
  btn.disabled = false; btn.textContent = 'Send OTP';
}

async function verifyOTP() {
  const phone = document.getElementById('otpPhone').value.trim();
  const otp = document.getElementById('otpCode').value.trim();
  try {
    const res = await fetch(API + '/auth/verify-otp', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ phone, otp })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(extractError(data, 'OTP verification failed'));
    storeAuth(data.token, data.user);
    showMsg('✅ Verified! Redirecting...', 'success');
    redirectToDashboard(data.user.role);
  } catch (e) {
    showMsg(e.message, 'error');
  }
}

// ── Google Sign-In (GSI One Tap) ──────────────────────────────────────────
let _gClientId = '';

async function _initGoogle() {
  try {
    const cfg = await fetch(API + '/auth/config').then(r => r.json());
    _gClientId = cfg.google_client_id || '';
  } catch {}
  if (!_gClientId) return; // Google not configured — button stays, shows friendly error
  if (!window.google) return; // GSI script still loading — onClick retries
  google.accounts.id.initialize({
    client_id: _gClientId,
    callback: _handleGoogleCredential,
    auto_select: false,
    cancel_on_tap_outside: true,
    context: 'signin',
  });
}

function doGoogleLogin() {
  if (!_gClientId) { showMsg('Google login is not configured on this server yet.', 'error'); return; }
  if (!window.google) { showMsg('Google Sign-In is still loading — please try again.', 'error'); return; }
  const btn = document.getElementById('googleBtn');
  btn.disabled = true;
  google.accounts.id.prompt(notification => {
    // One Tap dismissed or suppressed → open popup flow instead
    if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
      const params = new URLSearchParams({
        client_id: _gClientId,
        redirect_uri: window.location.origin + '/login.html',
        response_type: 'token id_token',
        scope: 'openid email profile',
        nonce: Math.random().toString(36).slice(2),
      });
      window.open('https://accounts.google.com/o/oauth2/v2/auth?' + params, '_blank', 'width=500,height=600');
    }
    btn.disabled = false;
  });
}

async function _handleGoogleCredential(response) {
  const btn = document.getElementById('googleBtn');
  if (btn) btn.disabled = true;
  showMsg('Signing in with Google…', 'success');
  try {
    const res = await fetch(API + '/auth/google-login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ credential: response.credential })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(extractError(data, 'Google login failed'));
    storeAuth(data.token, data.user);
    showMsg('✅ Signed in with Google! Redirecting…', 'success');
    redirectToDashboard(data.user.role);
  } catch (e) {
    showMsg(e.message, 'error');
    if (btn) btn.disabled = false;
  }
}

// Kick off config fetch immediately so GSI is ready when the user clicks
_initGoogle();

// Auto-redirect if already logged in
const existingToken = localStorage.getItem('jm_token');
const existingUser = localStorage.getItem('jm_user');
if (existingToken && existingUser) {
  try {
    const u = JSON.parse(existingUser);
    window.location.href = '/dashboard.html?role=' + u.role;
  } catch {}
}
</script>
<script src="/i18n-seed.js?v=4"></script>
<script src="/i18n-lite.js?v=4" defer></script>
</body>
</html>
