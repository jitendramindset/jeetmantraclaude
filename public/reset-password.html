<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — JeetMantra</title>
<script src="/ui/widgets/page/AuthShell.js?v=1"></script>
<script>document.write('<style>'+JM.AuthShell.css()+'</style>');</script>
</head><body>
<script>
document.write(JM.AuthShell({
  title: '🔐 Set a new password',
  sub: 'Pick something 8+ characters.',
  body: '<div id="msg" class="jm-auth-msg"></div>'
      + '<label>New password</label>'
      + '<input type="password" id="pw" placeholder="••••••••">'
      + '<label>Confirm password</label>'
      + '<input type="password" id="pw2" placeholder="••••••••">'
      + '<button class="jm-auth-btn" id="btn" onclick="submitPw()">Update password</button>',
  footer: '<a href="/login.html">← Back to login</a>'
}));
</script>
<script>
const token=new URLSearchParams(location.search).get('token');
if(!token){ document.getElementById('msg').className='jm-auth-msg err'; document.getElementById('msg').textContent='Missing reset token in URL.'; document.getElementById('btn').disabled=true; }
async function submitPw(){
  const pw=document.getElementById('pw').value, pw2=document.getElementById('pw2').value;
  const btn=document.getElementById('btn'), msg=document.getElementById('msg');
  msg.className='jm-auth-msg'; msg.textContent='';
  if(pw.length<8){ msg.className='jm-auth-msg err'; msg.textContent='Password must be 8+ chars'; return; }
  if(pw!==pw2){ msg.className='jm-auth-msg err'; msg.textContent="Passwords don't match"; return; }
  btn.disabled=true; btn.textContent='Updating…';
  try{
    const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:pw})});
    const j=await r.json();
    if(!r.ok){ msg.className='jm-auth-msg err'; msg.textContent=j.error||'Failed'; btn.disabled=false; btn.textContent='Update password'; return; }
    msg.className='jm-auth-msg ok'; msg.textContent=j.message||'Password updated.';
    setTimeout(()=>location.href='/login.html',1500);
  }catch(e){ msg.className='jm-auth-msg err'; msg.textContent='Network error'; btn.disabled=false; btn.textContent='Update password'; }
}
</script>
<script src="/i18n-seed.js?v=4"></script>
<script src="/i18n-lite.js?v=4" defer></script>
</body></html>
