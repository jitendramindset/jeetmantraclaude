version: '3.8'

services:
  # n8n Workflow Engine
  n8n:
    image: n8nio/n8n:latest
    container_name: jeetmantra_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=jeetmantra123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - DB_TYPE=sqlite
      - GENERIC_TEMP_NODE_ENABLED=true
      - NODES_INCLUDE=["n8n-nodes-base.webhook","n8n-nodes-base.httpRequest","n8n-nodes-base.function","n8n-nodes-base.set","n8n-nodes-base.merge","n8n-nodes-base.switch","n8n-nodes-base.itemLists"]
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_workflows:/home/node/.n8n/workflows
    networks:
      - jeetmantra_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database (optional - for future scaling)
  postgres:
    image: postgres:15-alpine
    container_name: jeetmantra_db
    environment:
      POSTGRES_USER: jeetmantra_user
      POSTGRES_PASSWORD: jeetmantra_secure_pwd_123
      POSTGRES_DB: jeetmantra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jeetmantra_network
    restart: unless-stopped

volumes:
  n8n_data:
  postgres_data:

networks:
  jeetmantra_network:
    driver: bridge
