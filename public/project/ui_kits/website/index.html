<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JeetMantra — The Modern Gurukul</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #f4f6f8; color: #0f172a; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Shared.jsx"></script>
<script type="text/babel" src="Pages.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [page, setPage] = useState('Home');

  useEffect(() => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, [page]);

  const noShellPages = ['Login'];
  const pageMap = {
    Home:      <HomePage setPage={setPage} />,
    Courses:   <CoursesPage setPage={setPage} />,
    Earn:      <EarnPage setPage={setPage} />,
    About:     <AboutPage setPage={setPage} />,
    Contact:   <ContactPage />,
    Login:     <LoginPage setPage={setPage} />,
    Directory: <DirectoryPage setPage={setPage} />,
  };

  const isShell = !noShellPages.includes(page);

  return (
    <div>
      {isShell && <Header page={page} setPage={setPage} />}
      {!isShell && (
        <div style={{ position: 'fixed', top: 16, left: 16, zIndex: 200 }}>
          <button onClick={() => setPage('Home')} style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'white', border: '1.5px solid #e5e7eb', borderRadius: 10, padding: '8px 14px', fontSize: 13, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit', boxShadow: '0 2px 8px rgba(0,0,0,0.08)' }}>← Back</button>
        </div>
      )}
      <main style={{ minHeight: '100vh' }}>
        {pageMap[page] || pageMap['Home']}
      </main>
      {isShell && <Footer setPage={setPage} />}
    </div>
  );
}

// Minimal About page
function AboutPage({ setPage }) {
  const pillars = [
    { icon: '🎓', title: 'Academic Excellence', desc: 'Structured coaching for board exams, JEE, NEET and CA — with experienced faculty and daily practice.' },
    { icon: '🛠️', title: 'Real-World Skills', desc: 'AI, coding, communication, sports — skills that matter beyond textbooks and ranks.' },
    { icon: '💰', title: 'Earn While You Learn', desc: 'Our earn system lets students make real money through referrals, tasks, and content — while still in school.' },
    { icon: '🤝', title: 'Partner Ecosystem', desc: 'Schools, activity centers, and coaches can partner with us to reach thousands of motivated students.' },
  ];
  return (
    <div>
      <section style={{ background: 'linear-gradient(135deg,#0f172a,#1e3a5f)', padding: '80px 32px', textAlign: 'center' }}>
        <div style={{ maxWidth: 700, margin: '0 auto' }}>
          <h1 style={{ fontSize: 52, fontWeight: 800, color: 'white', letterSpacing: '-0.03em', marginBottom: 18 }}>The Modern Gurukul</h1>
          <p style={{ fontSize: 17, color: 'rgba(255,255,255,0.65)', lineHeight: 1.75 }}>
            JeetMantra is not just a coaching institute. It's a complete education ecosystem — where students study, develop skills, earn money, and prepare for real life.
          </p>
        </div>
      </section>
      <section style={{ maxWidth: 1280, margin: '0 auto', padding: '80px 32px' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24, marginBottom: 64 }}>
          {pillars.map((p, i) => (
            <div key={i} style={{ background: 'white', borderRadius: 16, padding: '32px 28px', boxShadow: '0 4px 16px rgba(0,0,0,0.07)' }}>
              <div style={{ fontSize: 32, marginBottom: 14 }}>{p.icon}</div>
              <div style={{ fontSize: 18, fontWeight: 700, color: '#0f172a', marginBottom: 8 }}>{p.title}</div>
              <div style={{ fontSize: 14, color: '#64748b', lineHeight: 1.7 }}>{p.desc}</div>
            </div>
          ))}
        </div>
        <div style={{ background: '#f97316', borderRadius: 20, padding: '52px 48px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 24 }}>
          <div>
            <h2 style={{ fontSize: 32, fontWeight: 800, color: 'white', marginBottom: 8 }}>Ready to join the Gurukul?</h2>
            <p style={{ fontSize: 15, color: 'rgba(255,255,255,0.8)' }}>Book a free demo — no commitment needed.</p>
          </div>
          <button onClick={() => setPage('Contact')} style={{ background: '#0f172a', color: 'white', border: 'none', borderRadius: 10, padding: '14px 32px', fontSize: 15, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit', whiteSpace: 'nowrap' }}>
            Book Free Demo →
          </button>
        </div>
      </section>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
