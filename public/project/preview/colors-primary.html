<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f4f6f8; padding: 24px; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; }
  .swatch { border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.10); width: 120px; }
  .swatch-color { height: 72px; }
  .swatch-info { background: #fff; padding: 10px 12px; }
  .swatch-name { font-size: 12px; font-weight: 700; color: #0f172a; }
  .swatch-hex { font-size: 11px; color: #64748b; font-family: monospace; margin-top: 2px; }
  .section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #64748b; margin-bottom: 10px; margin-top: 20px; }
  .section-label:first-child { margin-top: 0; }
</style>
</head>
<body>
<div class="section-label">Saffron Orange — Primary</div>
<div class="grid">
  <div class="swatch"><div class="swatch-color" style="background:#fff7ed"></div><div class="swatch-info"><div class="swatch-name">Orange 50</div><div class="swatch-hex">#fff7ed</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#ffedd5"></div><div class="swatch-info"><div class="swatch-name">Orange 100</div><div class="swatch-hex">#ffedd5</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#fed7aa"></div><div class="swatch-info"><div class="swatch-name">Orange 200</div><div class="swatch-hex">#fed7aa</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#fdba74"></div><div class="swatch-info"><div class="swatch-name">Orange 300</div><div class="swatch-hex">#fdba74</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#fb923c"></div><div class="swatch-info"><div class="swatch-name">Orange 400</div><div class="swatch-hex">#fb923c</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#f97316"></div><div class="swatch-info"><div class="swatch-name">Orange 500 ★</div><div class="swatch-hex">#f97316</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#ea6c0a"></div><div class="swatch-info"><div class="swatch-name">Orange 600</div><div class="swatch-hex">#ea6c0a</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#c2520a"></div><div class="swatch-info"><div class="swatch-name">Orange 700</div><div class="swatch-hex">#c2520a</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#9a3e0c"></div><div class="swatch-info"><div class="swatch-name">Orange 800</div><div class="swatch-hex">#9a3e0c</div></div></div>
</div>

<div class="section-label">Amber — Secondary Accent</div>
<div class="grid">
  <div class="swatch"><div class="swatch-color" style="background:#fcd34d"></div><div class="swatch-info"><div class="swatch-name">Amber 300</div><div class="swatch-hex">#fcd34d</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#fbbf24"></div><div class="swatch-info"><div class="swatch-name">Amber 400 ★</div><div class="swatch-hex">#fbbf24</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#f59e0b"></div><div class="swatch-info"><div class="swatch-name">Amber 500</div><div class="swatch-hex">#f59e0b</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#d97706"></div><div class="swatch-info"><div class="swatch-name">Amber 600</div><div class="swatch-hex">#d97706</div></div></div>
</div>
</body>
</html>
