<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>EduOS — Platform OS</title>
<link rel="stylesheet" href="theme.css">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--jm-bg, #f6f7f9); color: var(--jm-text, #111); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; height: 100%; }

  /* Shell */
  .shell { display: grid; grid-template-columns: 240px 1fr; grid-template-rows: 56px 1fr; height: 100vh; min-height: 100vh; }
  .topbar { grid-column: 1/3; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--jm-surface, #fff); border-bottom: 1px solid var(--jm-border, #e5e7eb); position: sticky; top: 0; z-index: 20; }
  .topbar .brand { font-weight: 800; letter-spacing: -0.02em; font-size: 15px; }
  .topbar .brand .pill { background: linear-gradient(135deg, #7c3aed, #ec4899); color: #fff; padding: 1px 6px; border-radius: 4px; font-size: 10px; margin-left: 6px; vertical-align: 2px; }
  .topbar .grow { flex: 1; }
  .cmdk { width: 360px; max-width: 40vw; position: relative; }
  .cmdk input { width: 100%; padding: 7px 30px 7px 10px; background: var(--jm-surface-2, #f3f4f6); border: 1px solid var(--jm-border, #e5e7eb); border-radius: 6px; color: inherit; font-size: 13px; }
  .cmdk .kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 10px; color: var(--jm-text-muted, #999); background: var(--jm-surface, #fff); padding: 1px 5px; border: 1px solid var(--jm-border, #e5e7eb); border-radius: 3px; }
  .tenant-switcher { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; background: var(--jm-surface-2, #f3f4f6); border: 1px solid var(--jm-border, #e5e7eb); border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 99px; font-size: 11px; font-weight: 700; background: #ecfdf5; color: #047857; }
  .status-pill.degraded { background: #fffbeb; color: #b45309; }
  .status-pill.down { background: #fef2f2; color: #b91c1c; }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .icon-btn { background: none; border: none; cursor: pointer; padding: 5px; border-radius: 6px; font-size: 16px; }
  .icon-btn:hover { background: var(--jm-surface-2, #f3f4f6); }

  /* Sidebar */
  .sidebar { background: var(--jm-surface, #fff); border-right: 1px solid var(--jm-border, #e5e7eb); padding: 8px 6px; overflow-y: auto; }
  .nav-item { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 6px; cursor: pointer; color: var(--jm-text-strong, #111); font-size: 13px; font-weight: 500; user-select: none; position: relative; }
  .nav-item:hover { background: var(--jm-surface-2, #f3f4f6); }
  .nav-item.active { background: color-mix(in oklab, var(--jm-primary, #7c3aed) 12%, transparent); color: var(--jm-primary, #7c3aed); font-weight: 600; }
  .nav-item .ic { font-size: 15px; width: 18px; text-align: center; }
  .nav-item .badge { margin-left: auto; background: #ef4444; color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; }
  .nav-group-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--jm-text-muted, #888); padding: 12px 12px 4px; }

  /* Content */
  .content { overflow-y: auto; padding: 18px 22px; }
  .page-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px; }
  .page-sub { color: var(--jm-text-muted, #6b7280); font-size: 13px; margin: 0 0 18px; }

  /* KPI cards */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi { background: var(--jm-surface, #fff); border: 1px solid var(--jm-border, #e5e7eb); border-radius: 10px; padding: 14px; position: relative; overflow: hidden; }
  .kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--sc, #7c3aed); }
  .kpi .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--jm-text-muted, #6b7280); }
  .kpi .value { font-size: 24px; font-weight: 800; margin-top: 4px; letter-spacing: -0.02em; }
  .kpi .sub { font-size: 11px; color: var(--jm-text-muted, #6b7280); margin-top: 2px; }

  /* Cards */
  .row { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
  @media (max-width: 1024px) { .row { grid-template-columns: 1fr; } }
  /* Mobile / smartboard-portrait: collapse the fixed 240px sidebar (which left
     only ~120px for content on a 360px screen) into a single column with a
     horizontally-scrollable nav strip, so cards get full width and nothing
     overflows. Nav stays usable (items still switch sections via onclick). */
  @media (max-width: 768px) {
    /* minmax(0,1fr) lets the single column shrink below its content's min-content
       width — without it the nowrap nav row forces the column wider than the
       viewport and the whole page overflows. */
    .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: 56px auto 1fr; }
    .topbar { grid-column: 1 / -1; min-width: 0; }
    .sidebar { display: flex; flex-direction: row; align-items: center; gap: 6px;
      min-width: 0; max-width: 100vw;
      overflow-x: auto; overflow-y: hidden; white-space: nowrap;
      border-right: 0; border-bottom: 1px solid var(--jm-border, #e5e7eb); padding: 6px 8px; }
    .sidebar .nav-group-title { display: none; }
    .nav-item { flex: 0 0 auto; }
    .nav-item .badge { margin-left: 6px; }
    .content { padding: 14px; min-width: 0; }
    .cmdk { display: none; }
  }
  .card { background: var(--jm-surface, #fff); border: 1px solid var(--jm-border, #e5e7eb); border-radius: 10px; padding: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 6px; }
  .card h3 .accent { color: var(--jm-text-muted, #888); font-weight: 400; font-size: 11px; margin-left: auto; }

  /* Tables */
  table.list { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.list th { text-align: left; padding: 8px 10px; background: var(--jm-surface-2, #f9fafb); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--jm-text-muted, #6b7280); border-bottom: 1px solid var(--jm-border, #e5e7eb); }
  table.list td { padding: 9px 10px; border-bottom: 1px solid var(--jm-border, #e5e7eb); }
  table.list tr:last-child td { border-bottom: none; }
  table.list tr.row-hover:hover { background: var(--jm-surface-2, #f9fafb); cursor: pointer; }

  /* Sparkline */
  .spark { width: 100%; height: 60px; display: block; }
  .spark path { fill: none; stroke: var(--jm-primary, #7c3aed); stroke-width: 2; }
  .spark .area { fill: color-mix(in oklab, var(--jm-primary, #7c3aed) 14%, transparent); stroke: none; }

  /* Action inbox */
  .inbox-tile { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--jm-surface-2, #f9fafb); margin-bottom: 8px; cursor: pointer; }
  .inbox-tile:hover { background: color-mix(in oklab, var(--jm-primary, #7c3aed) 8%, var(--jm-surface-2, #f9fafb)); }
  .inbox-tile .ic { font-size: 18px; }
  .inbox-tile .count { margin-left: auto; font-weight: 800; font-size: 18px; color: var(--jm-primary, #7c3aed); }
  .inbox-tile .count.zero { color: var(--jm-text-muted, #888); }

  /* Status grid */
  .status-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .status-card { padding: 10px 12px; border-radius: 8px; background: var(--jm-surface-2, #f9fafb); }
  .status-card .name { font-size: 11px; text-transform: uppercase; color: var(--jm-text-muted, #6b7280); }
  .status-card .val  { font-weight: 700; font-size: 13px; margin-top: 2px; }
  .status-card.up   { border-left: 3px solid #10b981; }
  .status-card.degraded { border-left: 3px solid #f59e0b; }
  .status-card.down { border-left: 3px solid #ef4444; }

  /* Coming-soon */
  .coming { text-align: center; padding: 60px 20px; color: var(--jm-text-muted, #888); }
  .coming .em { font-size: 38px; margin-bottom: 8px; }

  /* Loading */
  .skel { background: linear-gradient(90deg, var(--jm-surface-2, #f3f4f6) 0%, var(--jm-border, #e5e7eb) 50%, var(--jm-surface-2, #f3f4f6) 100%); background-size: 200% 100%; animation: skel 1.4s linear infinite; border-radius: 4px; }
  @keyframes skel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
</style>

  <div class="topbar">

<script src="/jm-theme.js" defer></script>
<script src="/widget-registry.js"></script>
<script>
const API = '/api';
const STATE = { token: '', section: 'overview', activeInst: '' };

function el(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtMoney(n) { return '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 }); }
function fmtDate(s) { try { return new Date(s).toLocaleDateString('en-IN', { day:'2-digit', month:'short' }); } catch(_) { return ''; } }

async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + STATE.token,
      ...(STATE.activeInst ? { 'X-Active-Institution': STATE.activeInst } : {}),
      ...(opts.headers || {})
    }
  });
  if (r.status === 401) { window.location.href = '/login.html'; throw new Error('auth'); }
  const ct = r.headers.get('content-type') || '';
  return ct.includes('application/json') ? r.json() : r.text();
}

// ───── AUTH gate ─────
(function gate() {
  STATE.token = localStorage.getItem('jm_token') || '';
  const user = JSON.parse(localStorage.getItem('jm_user') || '{}');
  const role = user.user_type || user.role;
  if (!STATE.token || role !== 'admin') {
    window.location.href = '/login.html?next=/admin-os.html';
    return;
  }
  STATE.activeInst = localStorage.getItem('jm_active_institution') || '';
  if (STATE.activeInst === 'all') STATE.activeInst = '';
})();

// ───── Tenant switcher (reuse the dashboard pattern) ─────
async function loadTenantName() {
  const t = el('tenantName');
  if (!STATE.activeInst) { t.textContent = 'All tenants'; return; }
  try {
    const r = await api('/institutions/my-institutions');
    const links = r.institutions || r.links || [];
    const found = links.find(l => (l.institution_id || l.id) === STATE.activeInst);
    t.textContent = found ? (found.name || found.institution_name || 'Tenant') : 'All tenants';
  } catch(_) { t.textContent = 'All tenants'; }
}
el('tenantSwitcher').onclick = async () => {
  const r = await api('/institutions/my-institutions').catch(() => ({ institutions: [] }));
  const links = r.institutions || r.links || [];
  if (!links.length) { alert('No tenants linked'); return; }
  const choice = prompt('Switch to (0 = All tenants):\n' +
    ['All tenants', ...links.map(l => l.name || l.institution_name || 'Tenant')]
      .map((n, i) => `${i}. ${n}`).join('\n'));
  const idx = parseInt(choice, 10);
  if (isNaN(idx)) return;
  if (idx === 0) { localStorage.removeItem('jm_active_institution'); STATE.activeInst = ''; }
  else if (links[idx - 1]) {
    const id = links[idx - 1].institution_id || links[idx - 1].id;
    localStorage.setItem('jm_active_institution', id);
    STATE.activeInst = id;
  }
  loadTenantName();
  render(STATE.section);
};

// ───── System status pill ─────
async function loadStatus() {
  try {
    const s = await api('/admin/system/status');
    const pill = el('statusPill');
    const text = el('statusText');
    pill.className = 'status-pill ' + (s.overall === 'up' ? '' : s.overall);
    text.textContent = s.overall === 'up' ? 'All systems normal' : s.overall === 'degraded' ? 'Degraded' : 'Outage';
  } catch (_) {
    el('statusPill').className = 'status-pill down';
    el('statusText').textContent = 'Unreachable';
  }
}

// ───── Sparkline renderer ─────
function sparkline(series, accentVar = '--jm-primary') {
  if (!series || !series.length) return '<div class="spark"></div>';
  const vals = series.map(p => Number(p.amount || p.value || 0));
  const max = Math.max(...vals, 1);
  const min = Math.min(...vals, 0);
  const range = max - min || 1;
  const w = 100, h = 100;
  const stepX = w / Math.max(1, series.length - 1);
  const pts = vals.map((v, i) => `${(i * stepX).toFixed(2)},${(h - ((v - min) / range) * h).toFixed(2)}`);
  const line = 'M ' + pts.join(' L ');
  const area = line + ` L ${w},${h} L 0,${h} Z`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path class="area" d="${area}"></path>
    <path d="${line}"></path>
  </svg>`;
}

// ───── SECTIONS ─────
const SECTIONS = {
  overview: renderOverview,
  tenants:  renderTenants,
  people:   renderPeople,
  catalog:  renderCatalog,
  live:     renderLive,
  revenue:  renderRevenue,
  bookings: renderBookings,
  growth:   () => renderComingSoon('Growth & CRM', '📈', 'Leads · Admissions · Campaigns. Reuses /api/eduos/admissions.'),
  support:  renderSupport,
  automations: () => renderComingSoon('Automations', '🤖', 'n8n webhooks · Delivery health · Scheduled jobs · Templates. Reuses /api/n8n.'),
  aitrans:  () => renderComingSoon('AI & Translations', '🧠', 'Provider keys · Usage/spend by tenant · Quotas · Translation queue. Sprint 5.'),
  analytics: renderAnalytics,
  franchise:() => renderComingSoon('Franchise', '🌐', 'Branches · Network revenue · Per-branch KPIs. Reuses /api/eduos/franchise.'),
  widgets:  renderWidgetsConfig,
  integrations: renderIntegrations,
  system:   renderSystem
};

document.querySelectorAll('.nav-item').forEach(item => {
  item.onclick = () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    item.classList.add('active');
    render(item.dataset.section);
  };
});

function render(section) {
  STATE.section = section;
  const fn = SECTIONS[section] || SECTIONS.overview;
  fn();
}

// ───── Overview ─────
async function renderOverview() {
  el('content').innerHTML = `
    <h1 class="page-title">Platform Overview</h1>
    <p class="page-sub">Snapshot of the entire EduOS platform — KPIs, system status, and the operations action inbox.</p>
    <div class="kpi-grid" id="kpiGrid">
      ${['MAU', 'WAU', 'DAU', 'Users', 'Signups 30d', 'Revenue 30d'].map(l =>
        `<div class="kpi" style="--sc:#7c3aed"><div class="label">${l}</div><div class="value"><div class="skel" style="width:60px;height:24px"></div></div></div>`
      ).join('')}
    </div>
    <div class="row">
      <div class="card">
        <h3>💸 Revenue · last 30 days <span class="accent" id="rev30Total"></span></h3>
        <div id="revSpark"><div class="skel" style="height:60px"></div></div>
      </div>
      <div class="card">
        <h3>📥 Action inbox</h3>
        <div id="inbox"><div class="skel" style="height:30px;margin-bottom:8px"></div><div class="skel" style="height:30px;margin-bottom:8px"></div><div class="skel" style="height:30px"></div></div>
      </div>
    </div>
    <div style="height:14px"></div>
    <div class="row">
      <div class="card">
        <h3>🛰 System status</h3>
        <div id="sysStatus" class="status-grid"><div class="skel" style="height:48px"></div></div>
      </div>
      <div class="card">
        <h3>📜 Recent admin actions</h3>
        <div id="recentAudit"><div class="skel" style="height:30px;margin-bottom:6px"></div><div class="skel" style="height:30px;margin-bottom:6px"></div></div>
      </div>
    </div>
  `;

  // Load all overview data in parallel
  Promise.allSettled([
    api('/admin/analytics/overview'),
    api('/admin/actions/inbox'),
    api('/admin/system/status'),
    api('/admin/audit?limit=8')
  ]).then(([ov, inbox, sys, audit]) => {
    if (ov.status === 'fulfilled') paintKpis(ov.value);
    if (inbox.status === 'fulfilled') paintInbox(inbox.value.inbox || {});
    if (sys.status === 'fulfilled') paintStatus(sys.value);
    if (audit.status === 'fulfilled') paintAudit(audit.value.events || []);
  });
}
function paintKpis(d) {
  const cards = [
    { sc: '#7c3aed', label: 'MAU',          value: d.activity?.mau ?? 0,   sub: 'Active in last 30d' },
    { sc: '#0ea5e9', label: 'WAU',          value: d.activity?.wau ?? 0,   sub: 'Active in last 7d' },
    { sc: '#10b981', label: 'DAU',          value: d.activity?.dau ?? 0,   sub: 'Active in last 24h' },
    { sc: '#f59e0b', label: 'Users',        value: d.users?.total ?? 0,    sub: 'Total accounts' },
    { sc: '#ec4899', label: 'Signups 30d',  value: d.users?.signups30 ?? 0, sub: 'New this month' },
    { sc: '#6366f1', label: 'Revenue 30d',  value: fmtMoney(d.revenue?.last30Total || 0), sub: 'Completed payments' }
  ];
  el('kpiGrid').innerHTML = cards.map(k =>
    `<div class="kpi" style="--sc:${k.sc}"><div class="label">${k.label}</div><div class="value">${esc(k.value)}</div><div class="sub">${k.sub}</div></div>`
  ).join('');
  el('revSpark').innerHTML = sparkline(d.revenue?.series || []);
  el('rev30Total').textContent = fmtMoney(d.revenue?.last30Total || 0);
}
function paintInbox(inbox) {
  const items = [
    { ic: '✅', name: 'Approvals', key: 'approvals' },
    { ic: '💸', name: 'Payouts',   key: 'payouts' },
    { ic: '🎧', name: 'Support tickets', key: 'tickets' },
    { ic: '🚩', name: 'Content reports', key: 'reports' }
  ];
  el('inbox').innerHTML = items.map(i => {
    const n = inbox[i.key] || 0;
    return `<div class="inbox-tile"><span class="ic">${i.ic}</span><span>${i.name}</span><span class="count ${n === 0 ? 'zero' : ''}">${n}</span></div>`;
  }).join('');
  const supBadge = el('badge-support');
  if (inbox.tickets > 0) { supBadge.style.display = 'inline-block'; supBadge.textContent = inbox.tickets; }
}
function paintStatus(s) {
  const svc = s.services || [];
  el('sysStatus').innerHTML = svc.map(v =>
    `<div class="status-card ${v.status}"><div class="name">${esc(v.name)}</div><div class="val">${esc(v.status)} · ${v.latency_ms}ms</div></div>`
  ).join('');
}
function paintAudit(events) {
  if (!events.length) { el('recentAudit').innerHTML = '<div style="color:var(--jm-text-muted);font-size:13px">No admin actions recorded yet.</div>'; return; }
  el('recentAudit').innerHTML = events.slice(0, 8).map(e =>
    `<div style="padding:7px 0;border-bottom:1px solid var(--jm-border);font-size:12px">
      <strong>${esc(e.action)}</strong> · ${esc(String(e.target_id || '').slice(0, 8))}

  try {
    const d = await api('/admin/analytics/overview');
    const series = d.revenue?.series || [];
    const max = Math.max(1, ...series.map(s => s.amount));
    const bars = series.map(s => {
      const h = Math.round((s.amount / max) * 100);
      return `<div title="${esc(s.date)}: ${fmtMoney(s.amount)}" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:140px"><div style="height:${h}%;min-height:2px;background:var(--jm-primary,#6366f1);border-radius:3px 3px 0 0"></div></div>`;
    }).join('');
    el('anaBody').innerHTML = `
      <div class="card" style="margin-bottom:16px">
        <h3 style="margin:0 0 4px">💸 Revenue · last 30 days <span class="accent" style="float:right">${fmtMoney(d.revenue?.last30Total || 0)}</span></h3>
        <div style="display:flex;gap:2px;align-items:flex-end;margin-top:12px">${bars || '<div style="color:var(--jm-text-muted)">No data</div>'}</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px">
        ${[['DAU', d.activity?.dau],['WAU', d.activity?.wau],['MAU', d.activity?.mau],['Total users', d.users?.total],['Signups 30d', d.users?.signups30]].map(([l,v]) =>
          `<div class="card" style="text-align:center"><div style="font-size:26px;font-weight:800">${v ?? 0}</div><div style="color:var(--jm-text-muted);font-size:12px">${l}</div></div>`).join('')}
      </div>
    `;
  } catch (e) {
    el('anaBody').innerHTML = `<div class="card" style="color:#b91c1c">Error: ${esc(e.message)}</div>`;
  }
}

// ───── Widget config (W3 admin) — per-role widget visibility for an org ─────
const WG_ROLES = ['student','teacher','coaching','school','parent','coach','partner','institute_owner'];
let _wgOrgId = null, _wgSettings = {};

async function renderWidgetsConfig() {
  el('content').innerHTML = `
    <h1 class="page-title">Widget Configuration</h1>
    <p class="page-sub">Enable / disable dashboard widgets per role for an organization. Saved to the org's settings; the widget engine honors it live via GET /api/me/contexts.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
      <select id="wgcOrg" onchange="loadWidgetConfig()" style="padding:6px 10px;border:1px solid var(--jm-border);border-radius:6px;background:var(--jm-surface);color:inherit"><option value="">Loading orgs…</option></select>
      <select id="wgcRole" onchange="paintWidgetMatrix()" style="padding:6px 10px;border:1px solid var(--jm-border);border-radius:6px;background:var(--jm-surface);color:inherit">${WG_ROLES.map(r=>`<option value="${r}">${r}</option>`).join('')}</select>
      <button id="wgcSave" onclick="saveWidgetConfig()" disabled style="padding:6px 16px;border:none;border-radius:6px;background:var(--jm-primary,#6366f1);color:#fff;font-weight:700;cursor:pointer">Save</button>
    </div>
    <div class="card" id="wgcMatrix" style="padding:16px"><div style="color:var(--jm-text-muted)">Pick an organization to configure its widgets.</div></div>
  `;
  try {
    const r = await api('/admin/institutes?limit=100');
    const orgs = r.institutes || [];
    el('wgcOrg').innerHTML = '<option value="">Select organization…</option>' + orgs.map(o=>`<option value="${esc(o.id)}">${esc(o.name||o.id)}</option>`).join('');
  } catch(e){ el('wgcOrg').innerHTML = '<option value="">Failed to load orgs</option>'; }
}

async function loadWidgetConfig() {
  _wgOrgId = el('wgcOrg').value;
  if (!_wgOrgId) { el('wgcMatrix').innerHTML='<div style="color:var(--jm-text-muted)">Pick an organization.</div>'; el('wgcSave').disabled=true; return; }
  el('wgcMatrix').innerHTML='Loading…';
  try {
    const r = await api('/orgs/'+_wgOrgId+'/settings');
    _wgSettings = (r.settings && r.settings.settings) || {};  // the org's settings jsonb
    el('wgcSave').disabled=false;
    paintWidgetMatrix();
  } catch(e){ el('wgcMatrix').innerHTML='<div style="color:#b91c1c">Error: '+esc(e.message)+'</div>'; el('wgcSave').disabled=true; }
}

function paintWidgetMatrix() {
  const widgets = (window.EduOSWidgets && window.EduOSWidgets.WIDGETS) || [];
  const role = el('wgcRole').value;
  const cfg = (_wgSettings.widgets||{})[role] || {};
  const applicable = widgets.filter(w => !w.roles || w.roles.includes(role) || (w.roles && role==='institute_owner' && w.roles.includes('school')));
  el('wgcMatrix').innerHTML = applicable.length ? applicable.map(w => {
    const on = cfg[w.id] !== false;
    return `<label style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--jm-border);cursor:pointer">
      <input type="checkbox" ${on?'checked':''} onchange="wgcToggle('${w.id}',this.checked)" style="width:16px;height:16px">
      <span style="flex:1"><strong>${esc(w.title)}</strong> <span style="font-size:11px;color:var(--jm-text-muted)">${esc(w.category)} · ${esc(w.size)}</span></span>
    </label>`;
  }).join('') : '<div style="color:var(--jm-text-muted)">No widgets apply to this role.</div>';
}

function wgcToggle(wid, on) {
  const role = el('wgcRole').value;
  _wgSettings.widgets = _wgSettings.widgets || {};
  _wgSettings.widgets[role] = _wgSettings.widgets[role] || {};
  if (on) delete _wgSettings.widgets[role][wid]; else _wgSettings.widgets[role][wid] = false; // store only disabled
}

async function saveWidgetConfig() {
  if (!_wgOrgId) return;
  const btn = el('wgcSave'); btn.disabled=true; btn.textContent='Saving…';
  try {
    await api('/orgs/'+_wgOrgId+'/settings', { method:'PUT', body: JSON.stringify({ settings: _wgSettings }) });
    btn.textContent='Saved ✓';
    setTimeout(()=>{ btn.textContent='Save'; btn.disabled=false; }, 1500);
  } catch(e){ btn.textContent='Save'; btn.disabled=false; alert('Save failed: '+e.message); }
}

async function renderIntegrations() {
  el('content').innerHTML = `
    <h1 class="page-title">Integrations</h1>
    <p class="page-sub">Map email, SMS and AI providers here — stored in platform settings and used by the backend immediately (overrides server .env). Powered by /api/admin/settings.</p>
    <div id="intForm"><div class="card" style="padding:16px;color:var(--jm-text-muted)">Loading…</div></div>
  `;
  let cur = {};
  try { const r = await api('/admin/settings'); cur = r.settings || {}; } catch (e) {}
  const fieldHtml = (key, label, ph, type) => {
    const v = cur[key] || '';
    const masked = type === 'password' && v ? '' : v;  // don't pre-fill secrets
    const note = type === 'password' && v ? '<span style="font-size:11px;color:#16a34a">● set — leave blank to keep</span>' : '';
    return `<div style="margin-bottom:12px"><label style="display:block;font-size:12px;font-weight:700;margin-bottom:4px">${esc(label)} ${note}</label>
      <input id="int_${key}" type="${type}" value="${esc(masked)}" placeholder="${esc(ph)}" autocomplete="off"
        style="width:100%;padding:8px 11px;border:1px solid var(--jm-border);border-radius:6px;background:var(--jm-surface);color:inherit;font-size:13px"></div>`;
  };
  el('intForm').innerHTML = WG_INT_FIELDS.map(g => `
    <div class="card" style="padding:16px;margin-bottom:14px">
      <h3 style="margin:0 0 2px;font-size:14px">${g.group}</h3>
      ${g.hint ? `<div style="font-size:11px;color:var(--jm-text-muted);margin-bottom:12px">${esc(g.hint)}</div>` : '<div style="height:8px"></div>'}
      ${g.rows.map(r => fieldHtml(...r)).join('')}
    </div>`).join('') + `
    <div style="display:flex;gap:10px;align-items:center">
      <button id="intSave" onclick="saveIntegrations()" style="padding:9px 18px;border:none;border-radius:6px;background:var(--jm-primary,#6366f1);color:#fff;font-weight:700;cursor:pointer">Save integrations</button>
      <button onclick="testIntegrationEmail()" style="padding:9px 16px;border:1px solid var(--jm-border);border-radius:6px;background:var(--jm-surface);color:inherit;font-weight:700;cursor:pointer">Send test email to me</button>
      <span id="intMsg" style="font-size:13px;font-weight:700"></span>
    </div>
    <div class="card" style="padding:16px;margin-top:20px">
      <h3 style="margin:0 0 6px;font-size:14px">💾 Database backup</h3>
      <div style="font-size:11px;color:var(--jm-text-muted);margin-bottom:12px">Exports all tables via the Supabase REST API, compresses and AES-encrypts, saves to <code>backups/</code>. Configure <code>BACKUP_ENCRYPT_KEY</code> and optionally <code>BACKUP_S3_BUCKET</code> in .env or the server environment.</div>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">
        <button onclick="triggerBackup()" id="backupBtn" style="padding:8px 16px;border:none;border-radius:6px;background:#0f766e;color:#fff;font-weight:700;cursor:pointer">Run backup now</button>
        <button onclick="loadBackupList()" style="padding:8px 14px;border:1px solid var(--jm-border);border-radius:6px;background:var(--jm-surface);color:inherit;font-weight:700;cursor:pointer">Refresh list</button>
        <span id="backupMsg" style="font-size:13px;font-weight:700"></span>
      </div>
      <div id="backupList" style="font-size:12px;color:var(--jm-text-muted)">Click "Refresh list" to see saved backups.</div>
    </div>`;
}

async function saveIntegrations() {
  const payload = {};
  WG_INT_FIELDS.flatMap(g => g.rows).forEach(([key]) => {
    const v = el('int_' + key)?.value ?? '';
    // For password fields left blank, skip (keep existing); send everything else.
    const isSecret = /pass|secret|token|key/i.test(key);
    if (isSecret && v === '') return;
    payload[key] = v;
  });
  const btn = el('intSave'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await api('/admin/settings', { method: 'PUT', body: JSON.stringify(payload) });
    el('intMsg').textContent = '✓ Saved & applied'; el('intMsg').style.color = '#16a34a';
  } catch (e) { el('intMsg').textContent = 'Error: ' + e.message; el('intMsg').style.color = '#b91c1c'; }
  btn.disabled = false; btn.textContent = 'Save integrations';
  setTimeout(() => { el('intMsg').textContent = ''; }, 3000);
}

async function testIntegrationEmail() {
  el('intMsg').textContent = 'Sending…'; el('intMsg').style.color = 'var(--jm-text-muted)';
  try {
    const r = await api('/admin/test-email', { method: 'POST', body: '{}' });
    el('intMsg').textContent = r.sent ? '✓ Sent — check your inbox' : '⚠ ' + (r.note || 'Not sent (configure SMTP first)');
    el('intMsg').style.color = r.sent ? '#16a34a' : '#b45309';
  } catch (e) { el('intMsg').textContent = 'Error: ' + e.message; el('intMsg').style.color = '#b91c1c'; }
}

async function triggerBackup() {
  const btn = el('backupBtn'); btn.disabled = true; btn.textContent = 'Starting…';
  el('backupMsg').textContent = ''; el('backupMsg').style.color = 'var(--jm-text-muted)';
  try {
    const r = await api('/admin/backup/trigger', { method: 'POST', body: '{}' });
    el('backupMsg').textContent = `✓ Backup running (pid ${r.pid}) — refresh list in ~30s`;
    el('backupMsg').style.color = '#16a34a';
    setTimeout(() => loadBackupList(), 35000);
  } catch (e) {
    el('backupMsg').textContent = 'Error: ' + e.message;
    el('backupMsg').style.color = '#b91c1c';
  }
  btn.disabled = false; btn.textContent = 'Run backup now';
}

async function loadBackupList() {
  const div = el('backupList');
  div.textContent = 'Loading…';
  try {
    const r = await api('/admin/backup/list');
    if (!r.backups || r.backups.length === 0) {
      div.textContent = 'No backups found. Run one above or enable the --profile backup service.';
      return;
    }
    div.innerHTML = `<table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr style="text-align:left;border-bottom:1px solid var(--jm-border)">
        <th style="padding:4px 8px">File</th><th style="padding:4px 8px">Size</th><th style="padding:4px 8px">Created</th>
      </tr></thead><tbody>${r.backups.map(b => `<tr style="border-bottom:1px solid var(--jm-border)">
        <td style="padding:4px 8px;font-family:monospace">${esc(b.name)}</td>
        <td style="padding:4px 8px">${b.sizeMB} MB</td>
        <td style="padding:4px 8px">${new Date(b.createdAt).toLocaleString()}</td>
      </tr>`).join('')}</tbody></table>
      <div style="margin-top:6px;color:var(--jm-text-muted)">Stored in: <code>${esc(r.dir)}</code></div>`;
  } catch (e) { div.textContent = 'Error: ' + e.message; }
}

async function runMigration() {
  const file = el('migFile')?.value;
  if (!file) return;
  const btn = el('migBtn'); btn.disabled = true; btn.textContent = 'Running…';
  el('migMsg').textContent = ''; el('migMsg').style.color = 'var(--jm-text-muted)';
  try {
    const r = await api('/admin/migrations/run', { method: 'POST', body: JSON.stringify({ file }) });
    const errs = r.errors || [];
    if (errs.length) {
      el('migMsg').textContent = `⚠ ${r.statements} statements, ${errs.length} errors`;
      el('migMsg').style.color = '#b45309';
      console.error('[migration errors]', errs);
    } else {
      el('migMsg').textContent = `✓ ${r.statements} statements applied`;
      el('migMsg').style.color = '#16a34a';
    }
  } catch (e) {
    el('migMsg').textContent = 'Error: ' + e.message;
    el('migMsg').style.color = '#b91c1c';
  }
  btn.disabled = false; btn.textContent = 'Run migration';
}

<script>
/* App-shell embed mode: when hosted in the shell (?embed=1), hide controls that
   navigate OUT to the shell so they can't nest the iframe (shell supplies chrome). */
(function(){ try{ if(new URLSearchParams(location.search).get('embed')!=='1') return;
  document.documentElement.classList.add('embed');
  var s=document.createElement('style');
  s.textContent='html.embed a[href$="/dashboard.html"],html.embed a[href="/app"],html.embed [data-embed-hide]{display:none!important}';
  (document.head||document.documentElement).appendChild(s);
  var hide=function(){ document.querySelectorAll('[onclick]').forEach(function(el){ var o=el.getAttribute('onclick')||''; if(o.indexOf('dashboard.html')>-1 || /['"]\/app['"]/.test(o)) el.style.display='none'; }); };
  if(document.readyState!=='loading') hide(); else document.addEventListener('DOMContentLoaded',hide);
}catch(e){} })();
</script>
