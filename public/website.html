// ── Auth gate: redirect to login if no token ──
function requireAuth(callback) {
  const token = localStorage.getItem('jm_token');
  if (token) { callback(); return; }
  const ok = confirm('Please login or sign up first to book a demo / enroll.');
  if (ok) window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname);
}

// ── API helpers ──
const API = window.location.origin + '/api';
async function fetchJSON(path) {
  try { const r = await fetch(API + path); if (!r.ok) return null; return await r.json(); } catch { return null; }
}

  useEffect(() => {
    (async () => {
      // Try /api/courses first (public list), then /api/marketplace
      let list = null;
      const cRes = await fetchJSON('/courses');
      if (cRes && Array.isArray(cRes) && cRes.length) list = cRes;
      else if (cRes && cRes.courses) list = cRes.courses;
      else {
        const mRes = await fetchJSON('/marketplace');
        if (mRes && mRes.listings && mRes.listings.length) {
          list = mRes.listings.map(l => ({ ...l, ...(l.courses || {}) }));
        }
      }
      if (list && list.length) {
        setCourses(list.map((c, i) => {
          const cat = c.category || (c.level === 'beginner' ? 'Skills' : 'Academic');
          return {
            title: c.title || 'Untitled Course',
            subject: ICONS[cat] || '📚',
            schedule: c.schedule || '',
            price: c.price ? Number(c.price).toLocaleString('en-IN') : 'Free',

            gradient: GRADS[cat] || GRADS['Academic'],
            cat: cat,
            cover_image: c.cover_image || null,
          };
        }));
      } else {
        setCourses(FALLBACK);
      }
      setLoading(false);
    })();
  }, []);

  const shown = filter === 'All' ? courses : courses.filter(c => c.cat === filter);

    <div style={{ maxWidth: 1280, margin: '0 auto', padding: '60px 32px' }}>

function LoginPage({ setPage }) {
  const [role, setRole] = useState('Student');
  const [method, setMethod] = useState('id'); // 'id' | 'phone' | 'google'
  const [otpSent, setOtpSent] = useState(false);
  const [loading, setLoading] = useState(false);
  const [errorMsg, setErrorMsg] = useState('');

  const [jmId, setJmId] = useState('');
  const [jmPassword, setJmPassword] = useState('');
  const [phoneNumber, setPhoneNumber] = useState('');
  const [otpDigits, setOtpDigits] = useState(Array(6).fill(''));

  const roles = [
    { id: 'Student', icon: '🎓', desc: 'Access courses, attendance & wallet' },
    { id: 'Teacher', icon: '📋', desc: 'Manage classes, earnings & content' },
    { id: 'Partner', icon: '🤝', desc: 'List services, track bookings & revenue' },
  ];

  const handleSetOtpDigit = (index, val) => {
    const v = val.replace(/[^0-9]/g, '').slice(0,1);
    setOtpDigits(d => { const n = [...d]; n[index] = v; return n; });
  };

  const handleSignIn = async () => {
    setErrorMsg('');
    setLoading(true);
    try {
      const email = jmId.includes('@') ? jmId : `${jmId}@jeetmantra.in`;
      const result = await loginUser(email, jmPassword);
      if (result?.success) {
        redirectToDashboard();
      } else {
        setErrorMsg(result?.error || 'Login failed');
      }
    } catch (e) {
      setErrorMsg(e.message || 'Login failed');
    } finally { setLoading(false); }
  };

  const handleSendOtp = async () => {
    setErrorMsg('');
    setLoading(true);
    try {
      const res = await requestOTP(phoneNumber.replace(/\s+/g, ''));
      if (res?.success) {
        setOtpSent(true);
      } else {
        setErrorMsg(res?.error || 'Failed to send OTP');
      }
    } catch (e) {
      setErrorMsg(e.message || 'Failed to send OTP');
    } finally { setLoading(false); }
  };

  const handleVerifyOtp = async () => {
    setErrorMsg('');
    setLoading(true);
    try {
      const otp = otpDigits.join('');
      const res = await verifyOTP(phoneNumber.replace(/\s+/g, ''), otp);
      if (res?.success) {
        redirectToDashboard();
      } else {
        setErrorMsg(res?.error || 'OTP verification failed');
      }
    } catch (e) {
      setErrorMsg(e.message || 'OTP verification failed');
    } finally { setLoading(false); }
  };

  const handleGoogleLogin = async () => {
    setErrorMsg('');
    setLoading(true);
    try {
      const res = await loginWithGoogle('TEST_GOOGLE_TOKEN');
      if (res?.success) {
        redirectToDashboard();
      } else {
        setErrorMsg(res?.error || 'Google login failed');
      }
    } catch (e) {
      setErrorMsg(e.message || 'Google login failed');
    } finally { setLoading(false); }
  };

      <div style={{ width: '100%', maxWidth: 900, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 0, borderRadius: 24, overflow: 'hidden', boxShadow: '0 16px 64px rgba(0,0,0,0.14)' }}>

              <div style={{ fontSize: 20, fontWeight: 800, color: 'white', letterSpacing: '-0.02em' }}>Jeet<span style={{ color: '#f97316' }}>Mantra</span></div>            </div>
            <h2 style={{ fontSize: 34, fontWeight: 800, color: 'white', letterSpacing: '-0.02em', lineHeight: 1.15, marginBottom: 16 }}>India's<br/>Modern Gurukul</h2>
            <p style={{ fontSize: 14, color: 'rgba(255,255,255,0.55)', lineHeight: 1.75, marginBottom: 40 }}>Study. Earn. Grow — all in one place.</p>

  const noShellPages = ['Login'];

  return (

        <div style={{ position: 'fixed', top: 16, left: 16, zIndex: 200 }}>

  );
}
