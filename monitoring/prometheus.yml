# Prometheus scrape config — container metrics via cAdvisor + self.
# When the app exposes /metrics (wire `prom-client` in server.js), add an
# `api` job here scraping api:5000/metrics.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: cadvisor          # CPU/RAM/disk/net per container
    static_configs:
      - targets: ['cadvisor:8080']

  # - job_name: api             # uncomment once /metrics is exposed
  #   static_configs:
  #     - targets: ['api:5000']
