<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f4f6f8; padding: 28px 32px; }
  .row { display: flex; align-items: baseline; gap: 24px; padding: 14px 0; border-bottom: 1px solid #e5e7eb; }
  .row:last-child { border-bottom: none; }
  .meta { min-width: 140px; flex-shrink: 0; }
  .meta-name { font-size: 11px; font-weight: 700; letter-spacing: 0.10em; text-transform: uppercase; color: #64748b; }
  .meta-spec { font-size: 10px; color: #9ca3af; font-family: monospace; margin-top: 3px; }
  .specimen { color: #0f172a; }
</style>
</head>
<body>

<div class="row">
  <div class="meta"><div class="meta-name">Display XL</div><div class="meta-spec">96px / 800 / -0.03em</div></div>
  <div class="specimen" style="font-size:60px;font-weight:800;line-height:1.0;letter-spacing:-0.03em;">Seekho.</div>
</div>

<div class="row">
  <div class="meta"><div class="meta-name">Display LG</div><div class="meta-spec">72px / 800 / -0.03em</div></div>
  <div class="specimen" style="font-size:52px;font-weight:800;line-height:1.05;letter-spacing:-0.03em;">Bano. Jeeto.</div>
</div>

<div class="row">
  <div class="meta"><div class="meta-name">H1</div><div class="meta-spec">60px / 800 / -0.03em</div></div>
  <div class="specimen" style="font-size:42px;font-weight:800;line-height:1.1;letter-spacing:-0.02em;">Modern Gurukul</div>
</div>

<div class="row">
  <div class="meta"><div class="meta-name">H2</div><div class="meta-spec">48px / 700 / -0.02em</div></div>
  <div class="specimen" style="font-size:34px;font-weight:700;line-height:1.2;letter-spacing:-0.02em;">Our Programs</div>
</div>

<div class="row">
  <div class="meta"><div class="meta-name">H3</div><div class="meta-spec">36px / 700</div></div>
  <div class="specimen" style="font-size:26px;font-weight:700;line-height:1.25;">JEE & NEET Coaching</div>
</div>

<div class="row">
  <div class="meta"><div class="meta-name">H4</div><div class="meta-spec">24px / 600</div></div>
  <div class="specimen" style="font-size:20px;font-weight:600;line-height:1.35;">Earn While You Learn</div>
</div>

<div class="row">
  <div class="meta"><div class="meta-name">H5</div><div class="meta-spec">20px / 600</div></div>
  <div class="specimen" style="font-size:17px;font-weight:600;line-height:1.4;">Book Free Demo Class</div>
</div>

</body>
</html>
