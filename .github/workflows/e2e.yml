name: e2e

# Playwright end-to-end suite. Boots the real backend, then runs the e2e specs
# against it. The specs self-skip (via a /health guard) if the server is down,
# so a partial-secret environment degrades gracefully instead of failing red.

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'backend/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'backend/**'
      - 'e2e/**'
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Backend ────────────────────────────────────────────────────────────
      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Start backend (background)
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: '5000'
          # Secrets injected from repo settings; specs that need a real DB self-skip
          # if these are absent and /health still answers for the static-page sweep.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-32-chars-minimum-len' }}
        run: |
          node server.js > /tmp/eduos-server.log 2>&1 &
          echo "Waiting for /health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health > /dev/null; then echo "up"; break; fi
            sleep 2
          done
          curl -s http://localhost:5000/health || (echo "server never came up"; cat /tmp/eduos-server.log; exit 1)

      # ── E2E ────────────────────────────────────────────────────────────────
      - name: Install e2e deps + browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright specs
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:5000
          CI: 'true'
        run: npx playwright test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-report/
          retention-days: 14

      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/eduos-server.log || true
